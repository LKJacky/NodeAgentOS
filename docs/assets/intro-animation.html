/* Standalone. API scene numbers are 1–5. goTo() seeks without changing playback.

   28 seconds per loop. Reduced motion uses five

(() => {
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const caption=document.querySelector('.caption'),counter=document.querySelector('.counter');
const bars=[...document.querySelectorAll('.progress i')],pauseButton=document.querySelector('#pause');
const finalName=document.querySelector('.final-name'),replayButton=document.querySelector('#replay');
const COPY={
 'zh-CN':{
  captions:['单一回合，做最懂你的 Agent','云端在线，多端融合','连接应用，你的超级 Agent','应用扩展，无限可能','Node，你的专属 Agent'],
  devices:['台式机','笔记本','手机'],apps:['备忘录','Todo','计时器'],agent:'Agent',node:'Node',introLabel:'介绍',
  pause:'Ⅱ 暂停',play:'▷ 播放',replay:'↻ replay',pauseAria:'暂停动画',playAria:'播放动画',replayAria:'重新播放动画',
  filmAria:'Node 品牌介绍动画',stageAria:'动画舞台',narrationAria:'场景旁白',
  sr:'五幕介绍：单一回合，做最懂你的 Agent；云端在线，多端融合；连接应用，你的超级 Agent；应用扩展，无限可能；Node，你的专属 Agent。可暂停或重新播放。'
 },
 en:{
  captions:['One turn. An agent that knows you.','Online in the cloud, across every device.','Connect your apps. Your super agent.','Apps expand. Infinite possibilities.','Node. Your own agent.'],
  devices:['Desktop','Laptop','Phone'],apps:['Notes','Todo','Timer'],agent:'Agent',node:'Node',introLabel:'INTRODUCTION',
  pause:'Ⅱ Pause',play:'▷ Play',replay:'↻ Replay',pauseAria:'Pause animation',playAria:'Play animation',replayAria:'Replay animation',
  filmAria:'Node brand introduction animation',stageAria:'Animation stage',narrationAria:'Scene narration',
  sr:'Five scenes: One turn. An agent that knows you. Online in the cloud, across every device. Connect your apps. Your super agent. Apps expand. Infinite possibilities. Node. Your own agent. Pause or replay at any time.'
 }
};
function copy(){return COPY[lang]}
const durations=[6,6,6,7,7],starts=[0,6,12,18,25],total=32;
const playbackRate=total/28; // A modest 14.3% speed-up; reduced motion stays slow.
const samples=[3,4.7,4.7,5.8,6.2];
const motion=matchMedia('(prefers-reduced-motion: reduce)');
const params=new URLSearchParams(location.search),requested=Number(params.get('scene'));
let lang=(params.get('lang')||navigator.language||'zh-CN').toLowerCase().startsWith('zh')?'zh-CN':'en';let captions=COPY[lang].captions;
let reduced=motion.matches,scene=Number.isInteger(requested)&&requested>=1&&requested<=5?requested-1:0;
let time=starts[scene]+(params.get('still')==='1'?samples[scene]:0),playing=params.get('still')!=='1';
let last=0,raf=0,width=0,height=0,dpr=1,captionTimer=0,shown=-1,completionSent=false;
// Only the inline brand SVGs use Spectrum. All animated nodes interpolate
// purple -> cyan -> mint by their actual radius, in linear-light RGB.
const colors=['#7C5CFF','#22D3EE','#34D399'];
const sceneAccents=[colors[0],colors[1],colors[2],colors[1],colors[0]];
const toLinear=v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);
const toSrgb=v=>v<=.0031308?v*12.92:1.055*Math.pow(v,1/2.4)-.055;
const stops=colors.map(hex=>[1,3,5].map(i=>toLinear(parseInt(hex.slice(i,i+2),16)/255)));
function colorAtRadius(radius){
 const position=Math.max(0,Math.min(1,radius/128))*2;
 const segment=Math.min(1,Math.floor(position)),mix=position-segment;
 const rgb=stops[segment].map((v,i)=>Math.round(255*toSrgb(v+(stops[segment+1][i]-v)*mix)));
 return `rgb(${rgb.join(',')})`;
}
bars.forEach((bar,i)=>bar.style.setProperty('--segment-color',sceneAccents[i]));
const finalMark=document.querySelector('.final-mark');
const ease=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;
function setCaption(n,instant=false){
 if(shown===n)return;shown=n;clearTimeout(captionTimer);
 counter.textContent=String(n+1).padStart(2,'0');
 document.querySelector('.film').style.setProperty('--accent',sceneAccents[n]);
 if(instant||reduced){caption.textContent=captions[n];caption.classList.remove('fading')}
 else{caption.classList.add('fading');captionTimer=setTimeout(()=>{caption.textContent=captions[n];caption.classList.remove('fading')},220)}
}
function current(){let n=4;for(let i=0;i<5;i++)if(time<starts[i]+durations[i]){n=i;break}return [n,time-starts[n]]}
function resize(){const r=canvas.getBoundingClientRect();width=r.width;height=r.height;dpr=Math.min(devicePixelRatio||1,3);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);render()}
function line(x1,y1,x2,y2,color,alpha=.3){ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=3.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.globalAlpha=1}
function dot(x,y,r,color,alpha=1){ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}

function text(label,x,y,size=14,color='#9baeb4',alpha=1){ctx.globalAlpha=alpha;const scale=Math.min(width/640,height/540);ctx.font=`${Math.max(size,(size>=40?24:10)/scale)}px system-ui, "Microsoft YaHei", sans-serif`;ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(label,x,y);ctx.globalAlpha=1}
function icon(kind,x,y,color,alpha){
 ctx.save();ctx.translate(x,y);ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
 if(kind===0){ctx.rect(-11,-8,22,15);ctx.moveTo(0,7);ctx.lineTo(0,12);ctx.moveTo(-6,12);ctx.lineTo(6,12)}
 if(kind===1){ctx.rect(-10,-8,20,14);ctx.moveTo(-10,6);ctx.lineTo(-14,11);ctx.lineTo(14,11);ctx.lineTo(10,6)}
 if(kind===2){ctx.roundRect(-6,-11,12,23,3);ctx.moveTo(-2,8);ctx.lineTo(2,8)}
 if(kind===3){ctx.roundRect(-9,-11,18,23,2);for(let j=0;j<3;j++){ctx.moveTo(-5,-5+j*6);ctx.lineTo(5,-5+j*6)}}
 if(kind===4){ctx.roundRect(-10,-10,20,21,3);ctx.moveTo(-5,0);ctx.lineTo(-1,4);ctx.lineTo(6,-4)}
 if(kind===5){ctx.arc(0,1,10,0,Math.PI*2);ctx.moveTo(0,1);ctx.lineTo(0,-5);ctx.moveTo(-3,-13);ctx.lineTo(3,-13);ctx.moveTo(0,-13);ctx.lineTo(0,-9)}
 ctx.stroke();ctx.restore();
}
const deviceAngles=[[-Math.PI/2,0],[Math.PI*5/6,1],[Math.PI/6,2]];
const appAngles=[[-Math.PI/6,3],[Math.PI/2,4],[Math.PI*7/6,5]];
function devices(){return deviceAngles.map(([a,k],i)=>[a,copy().devices[i],k])}
function apps(){return appAngles.map(([a,k],i)=>[a,copy().apps[i],k])}
// Inner content radius <=128. Outer label centres are fixed at radius 215.
// Guides terminate at radius 168, before the icon/text boxes; they never enter them.
function satellites(group,p,t,subtle=false){
 group.forEach(([angle,label,kind],i)=>{const emerge=ease((p-i*.18)/1.5),r=115*emerge;
 const ux=Math.cos(angle),uy=Math.sin(angle),x=ux*r,y=uy*r,c=colorAtRadius(r);
 line(0,0,x,y,colors[0],.26*emerge*(subtle?.5:1));
 if(!reduced&&playing&&emerge>.5){const f=(t*.3+i*.3)%1;dot(x*f,y*f,1.6,colorAtRadius(r*f),.65)}
 dot(x,y,subtle?4:7,c,emerge*(subtle?.6:1));
 if(!subtle){
  const lx=ux*215,ly=uy*215;
  line(ux*(r+12),uy*(r+12),ux*168,uy*168,colors[0],.2*emerge);
  icon(kind,lx,ly-9,c,emerge);text(label,lx,ly+29,15,'#c4c3cd',emerge);
 }
 });
}

function cloud(p,t,fade=0,shrink=1){
 const count=22,amount=ease(p/4.8),fit=1;const angle=reduced?0:t*(.08+Math.min(p,6)*.045);
 const points=[];
 for(let i=0;i<count;i++){
 const birth=ease((amount*count-i)/5),a=i*2.399963+angle;
 const radius=(i<12?128:lerp(68,100,(i-12)/10))*birth*shrink*fit;
 const x=Math.cos(a)*radius,y=Math.sin(a)*radius;
 if(birth===0)continue;points.push([x,y]);
 const c=colorAtRadius(radius);line(0,0,x,y,colors[0],.22*birth*(1-fade));

 dot(x,y,4+(i%3)*.6,c,birth*(1-fade));
 }

}
function render(){
 if(!width||!height)return;
 const [n,local]=current(),p=reduced?samples[n]:local;
 // Scene 5 crossfades directly from the circle to the supplied Spectrum logo over 1.35s.
 // Only a gentle 12% scale-down is applied: endpoints never converge to a seed.
 const t=reduced?0:n===4&&p>=1.35?26.35:time;
 setCaption(n,!playing);bars.forEach((bar,i)=>bar.style.setProperty('--fill',i<n?1:i===n?local/durations[n]:0));
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
 const scale=Math.min(width/640,height/540),cx=width/2,cy=height*.5;
 ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);
 // A restrained monochrome grid; no glow layers or detached ambient dust.
 ctx.lineWidth=.5;
 for(let x=-340;x<=340;x+=36){ctx.globalAlpha=.035;ctx.strokeStyle='#a2a1af';ctx.beginPath();ctx.moveTo(x,-300);ctx.lineTo(x,300);ctx.stroke()}
 for(let y=-300;y<=300;y+=36){ctx.globalAlpha=.035;ctx.strokeStyle='#a2a1af';ctx.beginPath();ctx.moveTo(-340,y);ctx.lineTo(340,y);ctx.stroke()}ctx.globalAlpha=1;
 if(n===1)satellites(devices(),p,t);
 if(n===2){satellites(devices(),5,t,true);satellites(apps(),p,t)}
 if(n===3)cloud(p,t);
 const fade=n===4?ease(p/1.2):0;
 if(n===4)cloud(6,t,fade,lerp(1,.88,fade));
 const arrival=n===0?ease(p/1.1):1;
 const brand=n===4?ease((p-.1)/1.25):0;
 const pulse=reduced?1:1+.1*Math.sin(t*3.3);
 const coreAlpha=arrival*(n===4?1-fade:1);
 // Short, solid orbiting wisps keep the opening seed alive without a halo.
 if(n===0&&!reduced&&brand<.98){for(let j=0;j<5;j++){const a=t*1.6-j*.18,x=Math.cos(a)*(17+j),y=Math.sin(a)*(12+j);dot(x,y,2-j*.25,colorAtRadius(Math.hypot(x,y)),arrival*(1-j/5)*.35)}}
 dot(0,0,10*pulse,'#7C5CFF',coreAlpha);
 if(n===0)text(copy().agent,0,238,17,'#cfced7',arrival);
 // The resolved mark is the exact supplied SVG, not a canvas approximation.
 finalMark.style.opacity=String(brand);
 finalMark.style.transform=`translate(-50%,-50%) scale(${lerp(.94,1,brand)})`;

 ctx.restore();
}
function setLanguage(next){
 lang=String(next).toLowerCase().startsWith('zh')?'zh-CN':'en';captions=copy().captions;
 document.documentElement.lang=lang;finalName.textContent=copy().node;
 document.querySelector('.film').setAttribute('aria-label',copy().filmAria);
 document.querySelector('.stage').setAttribute('aria-label',copy().stageAria);
 document.querySelector('.narration').setAttribute('aria-label',copy().narrationAria);
 document.querySelector('.scene-meta span:last-child').textContent=copy().introLabel;
 replayButton.textContent=copy().replay;replayButton.setAttribute('aria-label',copy().replayAria);
 document.querySelector('.sr-only').textContent=copy().sr;
 const n=shown>=0?shown:scene;shown=-1;setCaption(n,true);syncButton();render();
}
function syncButton(){pauseButton.textContent=playing?copy().pause:copy().play;pauseButton.setAttribute('aria-label',playing?copy().pauseAria:copy().playAria)}
function frame(now){raf=0;if(!playing)return;if(last){const delta=Math.min((now-last)/1000,.1);time+=delta*(reduced?total/50:playbackRate)}last=now;
 if(time>=total){time%=total;completionSent=false}
 if(time>=31.5&&!completionSent){completionSent=true;if(parent!==window)parent.postMessage({kind:'node-agent:intro-done'},'*')}
 render();raf=requestAnimationFrame(frame);
}
function play(){if(playing&&raf)return;playing=true;last=0;syncButton();raf=requestAnimationFrame(frame)}
function pause(){playing=false;cancelAnimationFrame(raf);raf=0;last=0;syncButton();render()}
function replay(){time=0;completionSent=false;shown=-1;setCaption(0,true);render();play()}
function goTo(value){const n=Number(value);if(!Number.isInteger(n)||n<1||n>5)throw new RangeError('scene must be an integer from 1 to 5');time=starts[n-1]+samples[n-1];completionSent=false;last=0;setCaption(n-1,true);render()}
window.IntroAnimation={play,pause,replay,goTo,setLanguage};
window.addEventListener('message',(event)=>{const data=event.data;if(data&&data.kind==='node-agent:intro-language')setLanguage(data.language)});
function onMotion(e){reduced=e.matches;render()}
if(motion.addEventListener)motion.addEventListener('change',onMotion);
new ResizeObserver(resize).observe(canvas);
pauseButton.addEventListener('click',()=>playing?pause():play());document.querySelector('#replay').addEventListener('click',replay);
document.addEventListener('visibilitychange',()=>{last=0});
setLanguage(lang);setCaption(scene,true);resize();if(playing)play();
})();
</script>
