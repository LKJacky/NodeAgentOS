<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The shell's own picture, as a file: the bus with three nodes on it, the same drawing the page
       carries as its favicon. A home screen needs a file to fetch, so the page's inline glyph is
       written out once here — and it is written in the pages' 24-unit box like every other drawing in
       the repository.

       The field is full bleed and the drawing sits inside the middle 60%, because a `maskable` icon is
       cropped to whatever shape the platform uses (a circle, a squircle, a teardrop). A tile cropped
       anywhere inside that circle still shows the whole drawing.

       Three nodes in three colours, on the shell's indigo: the one picture in the repository that is
       a tile rather than a tab, so it is the one that has to read as a picture at 60px. -->
  <rect width="24" height="24" fill="#4f46e5" />
  <g
    fill="none"
    stroke-width="1.6"
    stroke-linecap="round"
    transform="translate(12 12) scale(0.72) translate(-12 -12)"
  >
    <path stroke="#ffffff" d="M11.2 7.7 6.4 15.3M12.8 7.7l4.8 7.6" />
    <circle cx="12" cy="5.5" r="2.5" stroke="#fbbf24" />
    <circle cx="5.5" cy="17.5" r="2.5" stroke="#2dd4bf" />
    <circle cx="18.5" cy="17.5" r="2.5" stroke="#f472b6" />
  </g>
</svg>
