    <script>

    <style>
      :root {
        color-scheme: light;
        --page: #f4f6fb;
        --surface: #ffffff;
        --surface-soft: #f8f9fc;
        --surface-hover: #f1f4fa;

        --muted: #596374;
        --faint: #6f7888;
        --line: #e4e8f0;

        --brand-soft: #eeecff;
        --danger: #d92d4b;
        --danger-soft: #fff0f3;
        --success: #15956f;

          color-scheme: dark;
          --page: #0d0f15;
          --surface: #151820;
          --surface-soft: #1a1e28;
          --surface-hover: #202531;
          --text: #f1f3f8;
          --muted: #9ca5b7;
          --faint: #7d8798;
          --line: #292e3a;
          --line-strong: #39404f;
          --brand: #8b83ff;
          --brand-fill: #5b52e8;
          --brand-dark: #4f46e5;
          --brand-soft: #29254d;
          --danger: #ff6b85;
          --danger-soft: #3a2029;
          --success: #4bd2a7;
          --shadow-sm: 0 1px 3px #0003;
          --shadow-md: 0 12px 36px #0004;
          --card: linear-gradient(150deg, #5f57e8, #3d34b8);
          --card-shadow: 0 14px 34px #0000004d;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--page);
        color: var(--text);
        font:
          14px/1.5 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;

      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button,
      .check,
      .row {
        -webkit-tap-highlight-color: transparent;
      }
      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      /* The connection state is a chip on the Today card's title row, beside the date and the sort
         control: it says what the list under it is doing, so it sits with the list. */
      .sync {
        display: flex;
        flex: none;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
      }
      .sync-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--faint);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--faint) 16%, transparent);
      }
      .sync.live .sync-dot {
        background: var(--success);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 16%, transparent);
      }
      /* The page is the one scroller: the Today card and the list are one column, and the column
         scrolls inside the workspace. The column is centred by its own margins rather than by this
         box: a flex parent stretches it to the frame's height, and a column exactly as tall as its
         frame can never scroll, however much it holds. */
      .workspace {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 20px 20px 32px;
        scrollbar-width: thin;
        scrollbar-color: var(--line-strong) transparent;
      }
      .column {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      /* The Today card: free text the human or the model writes, and the buttons the model puts on it.
         Pressing a button sends its message to the agent, so the card is a small control panel too. */
      .today {
        position: relative;
        flex: none;
        overflow: hidden;
        padding: 18px 20px 20px;
        border-radius: 18px;
        background: var(--card);
        box-shadow: var(--card-shadow);
        color: #fff;
      }
      .today::after {
        position: absolute;
        top: -70px;
        right: -50px;
        width: 210px;
        height: 210px;
        border-radius: 50%;
        background: #ffffff1a;
        content: '';
        pointer-events: none;
      }
      .today-head {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .card-title {
        margin: 0;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .today-date {
        font-size: 13px;
        font-weight: 600;
        color: #ffffffd9;
      }
      /* The card's title row holds the one control the reader works with: where the list is sorted
         from. It sits on the right, next to the date, and it is drawn at every width - a reorder
         control that only appears on hover is one nobody finds, least of all on a phone. */
      .today-tools {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        flex: none;
      }
      /* And the button keeps its size in a narrow card: the date beside it is the part that gives
         way when the row runs out of room. */
      .sort {
        flex: none;
      }
      /* 44px at every width, not only in the phone block: the card is a thing a thumb presses on a
         phone and a mouse aims at on a desktop, and one target is easier to keep right than two. */
      .sort-button {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 11px;
        outline: none;
        background: #ffffff26;
        color: #fff;
        cursor: pointer;
        transition:
          background 0.14s,
          color 0.14s,
          box-shadow 0.14s;
      }
      .sort-button svg {
        width: 18px;
        height: 18px;
      }
      .sort-button:hover {
        background: #ffffff3d;
      }
      .sort-button:focus-visible {
        box-shadow: 0 0 0 3px #ffffff80;
      }
      /* The visible state: while the list follows the clock instead of the order it was left in, the
         button is lit - a white card instead of a small tint, so it reads at a glance and in dark
         mode too. An open menu lights it the same way, so the button and the menu it owns look like
         one thing. */
      .sort-button.on,

        background: #fff;
        color: #4137bd;
      }
      .sort-menu {
        /* In the card's flow, under the button it belongs to: the card clips its own decoration, so a
           layer hanging out of it would be cut off at the card's edge. */
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: max-content;
        min-width: 190px;
        max-width: 100%;
        margin: 10px 0 0 auto;
        padding: 6px;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow-md);
        color: var(--text);
      }
      .sort-menu[hidden] {
        display: none;
      }
      .sort-item {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px; /* the same thumb target the card's buttons get */
        padding: 0 10px;
        border: 0;
        border-radius: 9px;
        outline: none;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .sort-item:hover {
        background: var(--surface-hover);
      }
      .sort-item:focus-visible {
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent);
      }
      /* The chosen mode is ticked, and the tick is the state - not a colour alone, which a reader who
         cannot tell brand purple from text grey would miss. */
      .sort-item .tick {
        width: 16px;
        flex: none;
        visibility: hidden;
        color: var(--brand);

      .sort-item[aria-checked='true'] {
        color: var(--brand);
        font-weight: 600;
      }
      .sort-item[aria-checked='true'] .tick {
        visibility: visible;
      }
      .card-text {
        white-space: pre-wrap;
        margin: 0;
        min-height: 1.5em;
      }

         show, and a made-up one would be worse than no line at all. */
      .card-updated {
        position: relative;
        margin: 8px 0 0;
        color: #ffffffb3;
        font-size: 11.5px;
      }
      .card-updated[hidden] {
        display: none;
      }

      .card-buttons {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      /* 44px is the smallest comfortable touch target, and a long label wraps instead of clipping. */
      .card-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        max-width: 100%;
        min-height: 44px;
        padding: 8px 16px;
        border: 0;
        border-radius: 11px;
        background: #fff;
        box-shadow: 0 6px 16px #1a13424d;
        color: #4137bd;
        font-weight: 600;
        text-align: left;
        overflow-wrap: anywhere;
        cursor: pointer;
        transition:
          transform 0.14s,
          box-shadow 0.14s;
      }
      .card-button:hover {

        box-shadow: 0 9px 20px #1a13425e;

      .card-button:focus-visible {
        outline: none;
        box-shadow:

      }
      .card-button:disabled {
        opacity: 0.7;
        cursor: progress;
      }
      .card-empty {
        margin: 0;
        color: #ffffffb3;
        font-size: 13px;
      }
      .card-result {
        position: relative;
        margin: 10px 0 0;
        font-size: 12.5px;
        line-height: 1.5;
        color: #ffffffd9;
        overflow-wrap: anywhere;

        display: none;
      }
      .card-result.bad {
        color: #ffd9df;
      }
      .presses {
        position: relative;
        margin-top: 12px;
        color: #ffffffb3;
        font-size: 12px;
      }
      .presses[hidden] {
        display: none;
      }
      .presses summary {
        cursor: pointer;
      }

        color: #ffffff8c;
        font-variant-numeric: tabular-nums;
      }
      .presses span {
        overflow-wrap: anywhere;
      }
      .presses .bad {
        color: #ffd9df;
      }
      /* The card and the list are one column, so this box is only the list's frame: it is as tall as
         what it holds and never a height of its own. It used to be `flex: 1 1 auto` with `min-height:

         whatever did not fit. */
      .panel {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow-sm);
      }
      .list-head {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 20px 12px;
      }
      .section-title {
        display: flex;
        align-items: center;

      .section-title h2 {

        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;

      .count {
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--brand-soft);
        color: var(--brand-dark);

      .summary {
        color: var(--muted);
        font-size: 12px;

      .add-row {
        flex: none;
        display: flex;
        gap: 8px;
        padding: 0 20px 12px;
      }
      .add-row input {
        flex: 1;
        min-width: 0;
        height: 42px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: none;
        background: var(--surface-soft);
        color: var(--text);
        transition:
          border-color 0.15s,
          box-shadow 0.15s,
          background 0.15s;
      }
      .add-row input::placeholder,
      .editor input::placeholder,
      .editor textarea::placeholder {
        color: var(--faint);
      }
      .add-row input:focus {
        border-color: var(--brand);
        background: var(--surface);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);
      }
      /* Every row at its natural height: nothing inside the page scrolls but the page, so the list
         grows and the workspace scrolls under it. This is the box that used to give its height away
         (`flex: 1 1 auto` with `min-height: 0`) — 10px tall in the shell's frame with 2810px of rows
         in it, and a wheel over it moved nothing. */
      .list {
        padding: 0 12px 10px;
      }
      .row {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 4px;
        padding: 12px;
        border-radius: 12px;
        /* A row can be moved by a transform while another one is dragged past it: the transition is
           what makes it make way instead of jump. The lifted row turns it off for itself. */
        transition:
          background 0.14s,
          transform 0.14s;
      }
      .row:hover {
        background: var(--surface-hover);
      }
      .row.today {
        background: var(--brand-soft);
      }
      .row.editing {
        background: var(--surface-soft);
      }
      /* The row in the air: lifted off the list with a shadow, so the hand can see what it holds, and
         the rows around it close the gap it left.  Nothing here moves the row - the transform that
         follows the finger is set from the pointer, one frame at a time, in the script below. */
      .row.dragging {
        z-index: 3;
        background: var(--surface);
        opacity: 0.96;
        box-shadow:
          0 10px 24px rgba(0, 0, 0, 0.18),
          0 2px 6px rgba(0, 0, 0, 0.12);
        transition: none;
        will-change: transform;
      }
      body.dragging {
        user-select: none;
        cursor: grabbing;
      }
      /* The frame a drop is drawn in. The rows that were making way would otherwise slide from their
         shifted places into the redrawn ones, which reads as the row taking a second step; the script
         takes this class off on the next frame, so the way-making transition is back for the next
         drag. */
      .list.dropping .row {
        transition: none;
      }
      .check {
        position: relative;
        width: 24px;
        height: 24px;
        flex: none;
        margin-top: 2px;
      }
      .check input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .check .box {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border: 1.5px solid var(--line-strong);
        border-radius: 6px;
        background: var(--surface);
        transition:
          background 0.14s,
          border-color 0.14s;
        pointer-events: none;
      }
      .check .box svg {
        width: 12px;
        height: 12px;
        color: #fff;
        opacity: 0;
        transition: opacity 0.12s;
      }
      .check input:checked + .box {
        border-color: var(--brand);
        background: var(--brand-fill);
      }
      .check input:checked + .box svg {
        opacity: 1;
      }
      .check input:focus-visible + .box {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent);
      }
      .row-main {
        flex: 1;
        min-width: 0;
      }
      .row-title {
        display: block;
        font-size: 14px;
        font-weight: 550;
        line-height: 1.45;
        overflow-wrap: break-word;
      }
      .row.done .row-title {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-thickness: 1.5px;
      }
      .row-text {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
      .row.done .row-text {
        color: var(--faint);
      }
      .row-meta {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
      }
      .row-actions {
        display: flex;
        align-items: center;
        gap: 2px;
        flex: none;
      }
      .icon {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 8px;
        outline: none;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 0.14s,
          background 0.14s,
          color 0.14s;
      }
      .icon svg {
        width: 16px;
        height: 16px;
      }
      /* The row's own buttons stay out of the way until you are on the row — and stay reachable by
         keyboard, because :focus-within shows them again the moment one of them has focus. */

      .row:focus-within .icon,
      .icon:focus-visible,
      .icon.on {
        opacity: 1;
      }
      .icon:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .icon.on {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .icon:focus-visible {
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent);
      }
      .icon.danger:hover {
        background: var(--danger-soft);
        color: var(--danger);
      }
      /* The two arrows are the one pair of row buttons that is always visible: a reorder control that
         appears on hover is one nobody finds, least of all on a phone. 30px here, 44px in the phone
         block below — a thumb needs the bigger one. */
      .icon.move {
        opacity: 1;
        color: var(--muted);
      }
      .icon.move:disabled {
        opacity: 0.3;
        cursor: default;
      }
      /* The grip: the handle that drags a row. 44px at every width, because it is a thumb target
         before it is anything else, and `touch-action: none` on it - and only on it - is what lets a
         finger move the row instead of scrolling the page. The page itself still scrolls by touch. */
      .grip {
        flex: none;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        min-width: 44px;
        min-height: 44px;
        margin: -12px 0 -12px -8px;
        align-self: center;
        padding: 0;
        border: 0;
        border-radius: 10px;
        outline: none;
        background: transparent;
        color: var(--faint);
        cursor: grab;
        opacity: 1;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        transition:
          background 0.14s,
          color 0.14s;
      }
      .grip svg {
        width: 18px;
        height: 18px;
        pointer-events: none;
      }
      .row:hover .grip {
        color: var(--muted);
      }
      .grip:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .grip:focus-visible {
        color: var(--text);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent);
      }
      .grip[aria-pressed='true'] {
        background: var(--brand-soft);
        color: var(--brand);
        cursor: grabbing;
      }
      .grip:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .editor {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .editor input,
      .editor textarea {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--line);

        background: var(--surface);
        color: var(--text);
        font-size: 13.5px;
        resize: vertical;
      }
      .editor textarea {
        min-height: 60px;
        line-height: 1.6;
      }
      .editor input:focus,
      .editor textarea:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);
      }
      .edit-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .primary,
      .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 42px;
        padding: 0 16px;

        border-radius: 10px;
        cursor: pointer;
        font-weight: 550;
        transition:
          background 0.14s,
          border-color 0.14s;
