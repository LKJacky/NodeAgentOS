      async function destroyAgent(name) {
        if (menuDelete !== null) menuDelete.disabled = true;
        const reply = await call(`${NODE}.destroy_agent`, { name });
        await refreshAgentsNow();
        if (!reply || reply.ok !== true) {
          const reason = reply && reply.error ? reply.error : t('destroy.noAnswer');
          alert(t('destroy.failed', { name, reason }));
        }
      }

      // A press anywhere else and Escape both close the menu: it is drawn over the page, and the
      // reader who has moved on should not be able to press a row they can no longer see.
      if (typeof document.addEventListener === 'function') {
        document.addEventListener('click', () => closeAgentMenu());
        document.addEventListener('contextmenu', (event) => {
          const target = event === undefined || event === null ? null : event.target;
          const inside =
            agentMenuBar !== null &&
            typeof agentMenuBar.contains === 'function' &&
            target !== null &&
            target !== undefined &&
            agentMenuBar.contains(target);
          if (!inside) closeAgentMenu();
        });
        document.addEventListener('keydown', (event) => {
          if (event === undefined || event === null || event.key !== 'Escape') return;
          closeAgentMenu();
          closeConfirm();
        });
      }

      // A Chinese, Japanese or Korean IME uses Enter to confirm its candidate — the very key this page
      // uses to send. `isComposing` is true for that keystroke, and `keyCode === 229` is the older signal
      // some browsers send instead of it. Without this check the line goes out the moment the writer
      // confirms a word, and the reader sees half-typed pinyin.
      const composing = (event) => event.isComposing === true || event.keyCode === 229;

      // An answer past either budget folds; where it folds follows its headings.
      const RESPONSE_FOLD_CHARS = 1400;
      const RESPONSE_FOLD_LINES = 18;

      const input = document.getElementById('text');
      const send = document.getElementById('send');
      const stop = document.getElementById('stop');
      const providerSwitch = document.getElementById('provider-switch');
      const agentsBar = document.getElementById('agents');
      const promptTokens = document.getElementById('prompt-tokens');
      const completionTokens = document.getElementById('completion-tokens');
      const totalTokens = document.getElementById('total-tokens');
      const usageRow = document.querySelector('.usage-summary');
      const queue = document.getElementById('queue');
      const tokenNumber = new Intl.NumberFormat('zh-CN');
      // A session's totals grow to millions, and `2,408,037` is a wider thing than the row it sits in:
      // the unit carries the size instead (`2.4m`), with one decimal while the tenth still says
      // something and none once the number is ten or more.
      const TOKEN_UNITS = [
        [1e9, 'b'],
        [1e6, 'm'],
        [1e3, 'k'],
      ];
      function compactTokens(count) {
        const smallest = TOKEN_UNITS.at(-1)[0];
        if (!Number.isFinite(count) || count < smallest) return tokenNumber.format(count);
        const at = TOKEN_UNITS.findIndex(([size]) => count >= size);
        const scaled = (size) => {
          const value = count / size;
          return value < 10 ? Math.round(value * 10) / 10 : Math.round(value);
        };
        let [size, unit] = TOKEN_UNITS[at];
        let value = scaled(size);
        // `999,999` rounds to `1000k`, which belongs in the unit above it.
        if (value >= 1000 && at > 0) {
          [size, unit] = TOKEN_UNITS[at - 1];
          value = scaled(size);
        }
        return `${value}${unit}`;
      }
      // How many messages one `history` call asks for. The page opens on the newest few — a transcript
      // can be thousands of lines long, and the node itself refuses a window that would not fit one bus
      // frame — and asks for one more page each time the reader reaches the top.
      const HISTORY_PAGE = 30;
      // How near the top (in px) counts as wanting the page before this one.
      const OLDER_AT = 120;
      const busy = () => sending || modelActive || streamingMessage !== null;
      // What the page knows on its own about a turn: `sending` is a `chat_no_wait` POST of this page
      // still in flight (the line being queued, not the turn), `modelActive` is what the node's events
      // said (a snapshot, a question, an announced line), and a streaming message is a turn by itself
      // — python streams one snapshot per token. None of the three decides what Send and Stop do any
      // more: the node's own `agent.status.state` does (see `controlState`), because a turn another tab
      // or the debug console started is a turn this page has to offer Stop for, and a turn the node is
      // already unwinding is one it must not offer Stop for again. These are only what the page has to
      // go on until its first status read comes back — the page is drawn before that answer arrives.
      //: How long a call with no result keeps its dot once the page has heard nothing more about it.
      //: The page's own clock, because a message carries no time: a page that opens onto a call left
      //: open — a node that died mid-tool, a result that fell outside the window it read — counts from
      //: when it started watching. A dot that pulses forever would claim what the page cannot know.
      const CALL_WAIT_MS = 60000;
      // What #log is showing now, one entry per top-level box, so the next paint rebuilds only the
      // boxes whose messages changed — in practice the streaming tail. Rebuilding all of them per
      // token is what made the page unusable while a long answer arrived.
      let drawn = [];
      // The rest of what that paint drew: the status line, and the `ask_user` state the cards read.
      let drawnStatus = null;
      // A window that was just read has no reader position to keep: the first paint of a feed puts the
      // log at its end without travelling there. Without this the log sits at the top of a transcript
      // nobody has scrolled yet, and the follow-the-tail scroll glides down it - a second of nothing
      // but motion every time the reader opens an agent.
      // A formula that had to be written as its own TeX — MathJax had not finished starting yet — is
      // news the moment it is a drawing, the same way a question changing its state is: the boxes are
      // all drawn again, once, and the reason is spent (see `drawMathWhenReady`).
      // What the reader folded open or shut themselves, under the fold's own name: a repaint rebuilds
      // a box the way its builder drew it, so this is what puts the reader's choice back — otherwise
      // clicking a card would look like it did nothing the moment the next snapshot arrived.
      // What the reader has decided about a thinking, under the message's own fold key, for as long as
      // the page lives: written by the click itself, so it survives the redraws a snapshot or a reload
      // makes. `foldChoices` cannot hold it — it is inferred by diffing a box against what its builder
      // drew, and the streaming tail's builder already draws the thinking open.
      // Where the reader has scrolled the body of an open thinking to, under the same fold key. The body
      // is capped and scrolls inside itself, and the box is rebuilt on every snapshot: a place someone
      // put by hand has to live outside it or the next token would throw it away.
      // The agent's own `ask_user` tool: a question waiting on the reader. The card is drawn from the
      // tool call itself, so it survives a repaint; what the page has to remember between repaints is
      // only this — an answer already sent, text typed but not sent, and which questions the node
      // has said it is waiting on.
      const ASK_TOOL = 'ask_user';
      // The waits of the questions the node has put a deadline on, by id: the instant the wait runs
      // out, and what the turn carries on with when it does. The node sends the instant rather than
      // the seconds that are left, because the page has to be right after it has been away: a tab in
      // the background, or a page that reloaded, cannot count seconds it was not there for.
      // The countdown line each card drew, by id, so a tick can move it without repainting the page.
      // Questions whose wait is over — the node said so, or the clock did. A card whose question is
      // in here says what the turn carried on with, and never that the reader is still being waited on.

      const el = (tag, cls, text) => {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      // Every fold is born with the state its builder would draw it in, and — where it has a name of
      // its own (a tool call id, a heading) — with that name: the state a reader gave it survives a
      // repaint under the same name, even when the boxes around it change.
      function fold(box, open, id) {
        box.dataset.fold = open ? '1' : '0';
        box.open = open;
        if (id) box.dataset.foldId = id;
        return box;
      }

      // The role a box opens with, in the reader's language: the message carries the bus's own word for
      // it (`assistant`, `user`, `system`, `tool`), which is an identifier, not a sentence.
      const roles = () => ({
        assistant: t('roles.assistant'),
        user: t('roles.user'),
        system: t('roles.system'),
        tool: t('roles.tool'),
      });

      // Raw HTML stays disabled. markdown-it also rejects unsafe link protocols by default.
      const markdown = window.markdownit({
        html: false,
        breaks: true,
        linkify: true,
        typographer: true,
      });

      // Formulas are part of the Markdown, not a pass over the page afterwards: the rules in
      // `math-rules` above turn a formula into a Markdown token while the text is read, which is what
      // keeps them out of code — and what makes one inside a table cell or a list item work at all.
      markdown.use(window.agentMath.plugin);

      function renderMarkdown(source) {
        const root = el('div', 'markdown');
        root.innerHTML = markdown.render(String(source ?? ''));
        for (const link of root.querySelectorAll('a')) {
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
        }
        return root;
      }

      //: How much of a thinking's first line its collapsed summary shows before it is ellipsised.
      const THINKING_PREVIEW_CHARS = 100;

      // The hint a folded thinking shows after its label: the thinking's first non-empty line,
      // whitespace flattened and cut near a hundred characters, so a reader sees what a turn was about
      // without clicking — and never the whole reasoning, which stays in the body.
      function thinkingPreview(text) {
        const first = String(text ?? '')
          .split('\n')
          .map((line) => line.replace(/\s+/g, ' ').trim())
          .find((line) => line !== '');
        if (first === undefined) return '';
        const cut =
          first.length > THINKING_PREVIEW_CHARS
            ? `${first.slice(0, THINKING_PREVIEW_CHARS).trimEnd()}…`
            : first;
        return cut;
      }

      // A reasoning model answers with its thinking beside the prose (or beside a tool call). It is
      // plain text — the thinking is not the answer, and it is often messy — and collapsed to a
      // one-line preview, so a hint shows without pushing the answer away. While `live` it is drawn
      // open instead: the reader watches a turn reason as it arrives, and the committed message that
      // replaces the tail folds it again. A fold the reader opened by hand is theirs: `id` names the
      // thinking by its message, and `openedThinking` keeps their choice through every redraw.
      function thinking(text, live = false, id = 'think') {
        // The button copies the whole reasoning — the text the fold holds, not the one-line preview it shows
        // while it is closed — and it sits at the end of that text, inside the fold: what is copied and the
        // way to copy it fold away and come back together, and a closed thinking carries no control of its
        // own. No time here either: a thinking does not take the round's time, the answer it belongs to does.
        const whole = String(text ?? '');
        const box = foldedTool(
          'think',
          t('fold.thinking'),
          text,
          'think',
          openedThinking.get(id) ?? live,
          thinkingPreview(text),
          messageFoot(null, whole, t('copy.thinking')),
        );
        box.dataset.thinkId = id;
        box.addEventListener('toggle', () => openedThinking.set(id, box.open));
        return box;
      }

      // A fold's summary: its label — a small-caps name, the CSS that uppercases `.fold-label` — and,
      // after it, the preview of what the fold is about, drawn by `.fold-preview` exactly as written.
      function foldHeading(label, preview) {
        const summary = el('summary');
        summary.append(el('span', 'fold-label', label));
        if (preview) summary.append(el('span', 'fold-preview', preview));
        return summary;
      }

      function usageLine(usage) {
        return el(
          'div',
          'token-usage',
          t('msg.usage', {
            input: tokenNumber.format(usage.prompt_tokens),
            output: tokenNumber.format(usage.completion_tokens),
            total: tokenNumber.format(usage.total_tokens),
          }),
        );
      }

      // When a message finished, as the transcript remembers it: the time it was committed, and — on an
      // answer — how long its round took. The node writes the stamp in UTC; the reader wants their own
      // clock, so it is turned into local hours and minutes here — a 24-hour clock, which is the same
      // five characters wide in every locale. A transcript written before the node stamped its lines,
      // or a line that is still being written, has no stamp and gets no element.
      function committedAt(message) {
        if (!message?.at) return null;
        const at = new Date(message.at);
        if (Number.isNaN(at.getTime())) return null;
        const time = at.toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
          hour12: false,
        });
        const took =
          typeof message.took_ms === 'number' && message.took_ms >= 0
            ? t('msg.took', { seconds: (message.took_ms / 1000).toFixed(1) })
            : '';
        return el('div', 'msg-time', `${time}${took}`);
      }

      // The end of a message: when it finished, and the way to take it away — one row, so the two arrive
      // and leave together rather than as two things that each happen to be quiet. The row is drawn for
      // whatever the box has: a stamped message gets its time on the left, a box with text of its own gets
      // the button on the right, and a box with neither gets no row at all. A thinking has a button and no
      // time of its own — a round is what takes time, and the round's own row says so.
      function messageFoot(message, text, label) {
        const foot = el('div', 'msg-foot');
        const stamp = committedAt(message);
        if (stamp) foot.append(stamp);
        if (text) foot.append(copyButton(text, label));
        return foot.children.length > 0 ? foot : null;
      }

      // The label row: who spoke, and what the turn cost. The time is not here: it belongs with the button
      // at the end of the message (see `messageFoot`), because the two are one thing to a reader. A message
      // that carries no usage (the reader's, a tool result) is just the label. A pushed message also says
      // who pushed it, right beside the role (`YOU · From timer`); the moment it was sent is that sender's
      // tooltip, because a reader who wants it can ask for it and a reader who does not is not made to
      // read a timestamp on every line.
      function roleLine(role, message, from = null) {
        const row = el('div', 'role', role);
        if (from) {
          // `textContent`, so a sender is a word and never markup: nothing about it is written as HTML.
          const tag = el('span', 'from', t('msg.from', { from: from.from }));
          tag.title = from.time;
          row.append(tag);
        }
        if (message.usage) row.append(usageLine(message.usage));
        return row;
      }

      //: What a node puts at the head of the message it pushes into the conversation: `FROM: <sender>,
      //: TIME: <stamp>` on one line, a blank line, then what was said. It is the envelope, not the
      //: message. Only the exact shape counts, only at the very start of a user message: a message that
      //: merely mentions `FROM:` — a quoted line, a fenced block, a sentence — is left as written, and
      //: an assistant or tool message is never searched at all (see `boxes`).
      const PUSH_META =
        /^FROM:[ \t]*([^\n]{1,200}?)[ \t]*,[ \t]*TIME:[ \t]*([0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,9})?[ \t]*UTC[+-][0-9]{2}:[0-9]{2})[ \t]*\r?\n(?:[ \t]*\r?\n)+/;

      /** A pushed message split into its envelope and its body, or `null` for one that carries none. */
      function splitPushMeta(content) {
        if (typeof content !== 'string') return null;
        const match = PUSH_META.exec(content);
        if (!match) return null;
        return { from: match[1], time: match[2], body: content.slice(match[0].length) };
      }

      //: How long a copy button says what it did before it goes quiet again: long enough to be read,
      //: short enough that a message is never left looking changed.
      const COPY_NOTE_MS = 1000;

      // The message's own text, as plain text: what the message said, not what its box happens to show
      // — a folded tool result and a rendered Markdown answer copy as the text they were drawn from.
      //
      // Copying happens inside the click and never after an `await`: the browser's own copy —
      // `document.execCommand('copy')` — only works while the click's user activation is still there,
      // and an `await` is what throws it away (in Safari and on iOS it is not given back, so a fallback
      // reached after one fails in silence). So where there is no Clipboard API the synchronous way is
      // the only way, and it is taken at once, before anything is awaited. The Clipboard API, where there
      // is one, is called here too — synchronously, so it sees the click's own activation — and only its
      // promise is awaited, which is what the API is for. A refusal is remembered (`clipboardRefused`), so
      // the click *after* one takes the synchronous way as well: the fallback is never something the page
      // only knows how to reach too late.
      //: Set once the Clipboard API has refused. A refusal is a refusal for the page's life — a permission
      //: the reader denied, a document that never gets focus — so from then on the document's own copy goes
      //: first, and it goes first *inside the click*, which is the only place it can work from.

      function copyText(text) {
        const clipboard = typeof navigator === 'undefined' ? null : navigator.clipboard;
        if (!clipboard?.writeText || clipboardRefused)
          return Promise.resolve(copyThroughDocument(text));
        try {
          return Promise.resolve(clipboard.writeText(text)).then(
            () => true,
            () => {
              clipboardRefused = true;
              return copyThroughDocument(text);
            },
          );
        } catch {
          // A browser can refuse before it even returns a promise — an insecure origin, a permission the
          // reader denied, a document that is not focused. That refusal is remembered for the next click,
          // which will then be synchronous; this one is late, and tries anyway rather than copying nothing.
          clipboardRefused = true;
          return Promise.resolve(copyThroughDocument(text));
        }
      }

      // The fallback: the text goes into a text area off the page, is selected, and the document copies
      // the selection. A browser with no `execCommand` copies nothing and the button says so.
      function copyThroughDocument(text) {
        if (typeof document.execCommand !== 'function') return false;
        const area = el('textarea', 'copy-source');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.position = 'fixed';
        area.style.top = '-1000px';
        document.body.append(area);
        let copied = false;
        try {
          area.select();
          copied = document.execCommand('copy') === true;
        } catch {
          copied = false;
        }
        area.remove();
        return copied;
      }

      // What the button draws instead of saying it: the classic copy mark — two sheets, the one behind
      // offset — and its two answers, a tick and a cross. Inline SVG, so the page stays one file, and
      // `currentColor`, so the marks follow the bubble and the colour scheme. Which one is up is the
      // button's own `data-state`; the words live in its label, where a screen reader finds them.
      const COPY_MARK =
        '<svg class="copy-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
        '<rect x="9" y="8.5" width="11.5" height="11.5" rx="2.6"/>' +
        '<path d="M6.5 15.5H5.4A2.4 2.4 0 0 1 3 13.1V5.4A2.4 2.4 0 0 1 5.4 3h7.7a2.4 2.4 0 0 1 2.4 2.4v1.1"/></svg>';
      const OK_MARK =
        '<svg class="copy-ok" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
        '<path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
      const NO_MARK =
        '<svg class="copy-no" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
        '<path d="M7 7l10 10M17 7L7 17"/></svg>';

      // One copy button, carrying the text it copies — captured when the box was drawn, so a click never
      // has to go looking for the message it belongs to. It answers with a shape for a second rather than
      // with a word, and the shape is the only thing that changes: the box keeps its size, so nothing
      // around it jumps when the mark becomes a tick. The listener is a plain one and not an async
      // function, because the copy is started in the click's own task and only its answer is awaited.
      // `label` says what is being copied; while there is nothing to report, the button says that.
      function copyButton(text, label = null) {
        const button = el('button', 'copy');
        button.type = 'button';
        button.innerHTML = COPY_MARK + OK_MARK + NO_MARK;
        const saying = (state) => {
          const said =
            state === 'copied'
              ? t('copy.copied')
              : state === 'failed'
                ? t('copy.failed')
                : (label ?? t('copy.thisMessage'));
          button.dataset.state = state;
          button.setAttribute('aria-label', said);
          button.title = said;
        };
        saying('copy');
        let note = null;
        // A plain listener and not an async function: the copy starts in the click's own task, so the
        // browser still sees the reader's activation, and only its answer is awaited. Nothing a click does
        // but copy — no copy button rides a fold's summary any more, so no click here is also a toggle.
        button.addEventListener('click', () => {
          copyText(text).then((copied) => {
            saying(copied ? 'copied' : 'failed');
            clearTimeout(note);
            note = setTimeout(() => saying('copy'), COPY_NOTE_MS);
          });
        });
        return button;
      }

      // Only a box with text of its own has something to copy: a round of tool calls with no prose, a
      // thinking's live status line and an empty snapshot have none, and get no button. `label` is what
      // is being copied, for a reader who cannot see where the button sits.
      function withCopy(box, text, label) {
        if (text) box.append(copyButton(text, label));
        return box;
      }

      /** The word a state shows: the node's own word for machines (`idle` / `generating` / `tool` /
       *  `stopping`), made readable here. The words live in the resource, so this is the only place that
       *  knows which state a key belongs to; a state this page has not been taught is shown as the node
       *  wrote it. */
      function stateLabel(state) {
        const key = {
          idle: 'state.idle',
          generating: 'state.generating',
          tool: 'state.tool',
          stopping: 'state.stopping',
        }[state];
        return typeof key === 'string' ? t(key) : state;
      }

      /** A dash means the count is unknown, not zero — and the row says which kind of unknown it is,
       *  because “nothing yet” and “the provider reported none” look the same otherwise and a reader
       *  cannot tell a quiet session from a broken page. */
      function renderUsage(usage) {
        const reported = usage.reported_calls > 0;
        const calls = usage.model_calls > 0;
        const counts = [
          [promptTokens, usage.prompt_tokens],
          [completionTokens, usage.completion_tokens],
          [totalTokens, usage.total_tokens],
        ];
        for (const [node, count] of counts)
          node.textContent = reported ? compactTokens(count) : '—';
        usageRow.title = reported
          ? ''
          : calls
            ? usage.model_calls === 1
              ? t('usage.noCountsOne')
              : t('usage.noCounts', { calls: usage.model_calls })
            : t('usage.noCallYet');
      }

      /** A node whose status carries no usage at all: same dashes, and the row says that instead of
       *  leaving the reader to guess. */
      function renderUsageMissing() {
        for (const node of [promptTokens, completionTokens, totalTokens]) node.textContent = '—';
        usageRow.title = t('usage.none');
      }

      /** The newest status read: the state word under the transcript, the queue above the composer. */

      function renderStatus(page, status) {
        withPage(page, () => {
          agentStatus = status && typeof status === 'object' ? status : null;
          const row = agentRows.find((each) => each.name === page.name);
          if (row && typeof agentStatus?.state === 'string') {
            row.state = agentStatus.state;
            renderAgents();
          }
          // The queue, the usage row and the two buttons belong to the page on screen: a status read
          // for a page nobody is looking at changes that page and nothing else.
          if (page === pages.get(currentAgent)) {
            renderQueue(agentStatus?.queued);
            if (agentStatus?.usage) renderUsage(agentStatus.usage);
            else if (agentStatus !== null) renderUsageMissing();
            // Send and Stop are drawn from this word, so a status that arrives puts them right now
            // rather than on the next paint: a box may have nothing to redraw, and a Stop left over
            // from the last turn is exactly what the reader is looking at while it is wrong.
            renderControls();
          }
          scheduleRender(page);
        });
      }

      /** The messages the node has taken but not read yet, oldest first, as one line each. */
      function renderQueue(queued) {
        const waiting = Array.isArray(queued) ? queued : [];
        queue.replaceChildren();
        for (const message of waiting) {
          const row = el('div', 'queue-item');
          row.append(el('strong', null, t('queue.queued')));
          row.append(document.createTextNode(String(message?.content ?? '')));
          queue.append(row);
        }
        queue.hidden = waiting.length === 0;
      }

      // `bodyExtra` is what a fold carries at the end of its body, under the text it belongs to — the
      // thinking's copy button, the one control a fold has. In the body it folds with the content, which is
      // what a reader who wants the reasoning elsewhere is looking at when they reach for it.
      function foldedTool(cls, label, content, id, open = false, preview = '', bodyExtra = null) {
        const box = el('details', cls);
        const body = el('div', 'plain', content);
        if (bodyExtra) body.append(bodyExtra);
        box.append(foldHeading(label, preview), body);
        return fold(box, open, id);
      }

      function section(label, content) {
        const box = el('div', 'section');
        box.append(el('div', 'section-label', label), content);
        return box;
      }

      // This agent offers exactly three tools, so each one gets a heading a reader can use at a
      // glance: a label saying what kind of call it is, and the node and capability the model named,
      // exactly as it wrote them. An unknown tool falls back to its name.
      function toolHeading(call) {
        const args = parseCallArgs(call) ?? {};
        const name = call.function.name;
        if (name === 'list_nodes') return { label: t('tool.listNodes') };
        if (name === 'list_node_tools')
          return { label: t('tool.listTools'), detail: String(args.node ?? '?') };
        if (name === 'run_on_node')
          return { label: t('tool.call'), detail: `${args.node ?? '?'}.${args.tool_name ?? '?'}` };
        return { label: t('tool.call'), detail: String(name) };
      }

      /** Whether the page is still waiting on a round's calls that have no result. A round the
       *  transcript has moved past is one no result is coming for, and so is one the page has been
       *  quiet about for longer than CALL_WAIT_MS; while a turn runs the wait stands, however long
       *  the tool takes. An ask_user call is left out: it is waiting for the reader, not for a result. */
      function stillWaiting(calls, results, movedOn) {
        const answered = new Set(results.map((result) => result.tool_call_id));
        const awaiting = calls.filter(
          (call) => call.function?.name !== ASK_TOOL && !answered.has(call.id),
        );
        if (awaiting.length === 0 || movedOn) return false;

        const now = Date.now();
        for (const call of awaiting) if (!waitSince.has(call.id)) waitSince.set(call.id, now);
        if (busy()) return true;

        // The round waits as long as the first of its calls does: they were all asked at once.
        const since = Math.min(...awaiting.map((call) => waitSince.get(call.id)));
        const left = since + CALL_WAIT_MS - now;
        if (left > 0) setTimeout(scheduleRender, left);
        return left > 0;
      }

      /** An unanswered call, as the card's summary: a dot and the address being called. The words are
       *  the reader's; the closing words for the dot are the screen reader's, which then hears the
       *  state itself and not an ellipsis. The address is the one the settled card wears — the same
       *  heading — so a call whose arguments are still arriving reads `calling ?.?…`, not a guess. */
      function parseCallArgs(call) {
        try {
          const value = JSON.parse(call.function?.arguments ?? '');
          return value && typeof value === 'object' ? value : null;
        } catch {
          return null;
        }
      }

      // The node's deadline for a question, as the page reads it: the instant the wait runs out and
      // the default the turn carries on with, or null for a question with no deadline at all.
      function askWait(message) {
        const at = Date.parse(message?.deadline ?? '');
        if (!Number.isFinite(at)) return null;
        return { deadline: at, default: message.default ?? null };
      }

      // The tool's own word that nobody answered in time: the object the python agent returns when a
      // question runs out of time. Null for every other result, a real answer included.
      function timeoutVerdict(answer) {
        try {
          const value = JSON.parse(answer);
          return value && value.answered === false && value.reason === 'timeout' ? value : null;
        } catch {
          return null;
        }
      }

      // What a question that ran out of time says instead of a countdown: the answer the turn carried
      // on with, when the question named one.
      const timedOutNote = (used) =>
        used === null || used === undefined
          ? t('ask.timedOutNoAnswer')
          : t('ask.timedOutDefault', { used });

      // Whole seconds left, rounded up: the line says "42s left" with 41.2 seconds on the clock, and
      // only reaches zero when the wait is really over.
      const secondsLeft = (wait) => Math.max(0, Math.ceil((wait.deadline - Date.now()) / 1000));

      // The countdown line itself, kept by its question's id so a tick can move it without a repaint.
      function countdownLine(id, wait) {
        const left = secondsLeft(wait);
        const line = el(
          'div',
          'ask-countdown',
          left > 0 ? t('ask.secondsLeft', { seconds: left }) : timedOutNote(wait.default),
        );
        askCountdowns.set(id, line);
        return line;
      }

      // One ticker for the page, and it lives only while there is something to count: a question the
      // node is still waiting on, whose deadline has not passed. Answered, given up on, or past its
      // deadline, a question stops being one — and the last of them stops the ticker. Every tick reads
      // the clock instead of adding up the ticks it has seen, which is what lets a tab that was in the
      // background come back to the right second. True when a clock just ran out, because the badge a
      // card drew ("waiting for your answer") is no longer true and the caller has to reload.
      function tickWaits() {
        let counting = false;
        let news = false;
        for (const [id, wait] of askWaits) {
          if (!liveAsks.has(id) || askTimedOut.has(id)) continue;
          const left = secondsLeft(wait);
          if (left > 0) {
            counting = true;
            const line = askCountdowns.get(id);
            if (line) line.textContent = t('ask.secondsLeft', { seconds: left });
            continue;
          }
          askTimedOut.add(id);
          liveAsks.delete(id);
          news = true;
          const line = askCountdowns.get(id);
          if (line) line.textContent = timedOutNote(wait.default);
        }
        if (!counting) stopWaitTicker();
        return news;
      }

      function startWaitTicker() {
        if (askTimer === null)
          askTimer = setInterval(() => {
            if (tickWaits()) reload();
          }, 1000);
      }

      function stopWaitTicker() {
        if (askTimer === null) return;
        clearInterval(askTimer);
        askTimer = null;
      }

      // One ask_user call -> one card. The question comes out of the call's own arguments, which the
      // page can already read while the model is still streaming them; the answer comes back as an
      // ordinary tool result, matched by the call's id like every other result.
      function askCard(call, result) {
        const id = call.id;
        const card = el('article', 'ask');
        card.dataset.askId = id;
        const args = parseCallArgs(call);
        if (!args) {
          // Still streaming: a question being written, not a form to answer yet.
          card.append(
            el('div', 'ask-badge', t('ask.preparing')),
            el('div', 'ask-body plain', call.function?.arguments ?? ''),
          );
          return card;
        }

        const selections = Array.isArray(args.selections) ? args.selections.map(String) : [];
        const mode =
          args.input === 'button' || args.input === 'text'
            ? args.input
            : selections.length
              ? 'button'
              : 'text';
        const answer = result ? String(result.content ?? '') : null;
        const answered = answer !== null && /^user (chose|answered):/.test(answer);
        const cancelled = answer === 'cancelled by user';
        const failed = answer !== null && !answered && !cancelled;
        const sent = answer === null && askSent.has(id);
        // The wait the node announced, and the result's own word on whether it ran out: either way a
        // question that is over is not waiting on the reader, and a card must not say that it is.
        const wait = askWaits.get(id) ?? null;
        const verdict = answer === null ? null : timeoutVerdict(answer);
        const timedOut = verdict !== null || (answer === null && askTimedOut.has(id));
        const used = wait?.default ?? verdict?.answer ?? null;
        if (answer !== null) {
          liveAsks.delete(id);
          askWaits.delete(id);
          askCountdowns.delete(id);
          askTimedOut.delete(id);
        }

        card.append(
          el(
            'div',
            'ask-badge' + (failed && !timedOut ? ' error' : ''),
            answer === null
              ? timedOut
                ? t('ask.timedOut')
                : liveAsks.has(id)
                  ? t('ask.waiting')
                  : t('ask.yours')
              : answered
                ? t('ask.answered')
                : cancelled
                  ? t('ask.cancelled')
                  : timedOut
                    ? t('ask.timedOut')
                    : t('ask.failed'),
          ),
        );
        card.append(
          el('h4', 'ask-title', String(args.title || t('ask.defaultTitle'))),
        );
        if (args.content) {
          const body = renderMarkdown(args.content);
          body.classList.add('ask-body');
          card.append(body);
        }
        // The wait sits under the question it belongs to: the clock while the node is on it, and then
        // the note that the turn carried on with the question's own default.
        if (timedOut) {
          card.append(el('div', 'ask-countdown', timedOutNote(used)));
        } else if (wait) {
          card.append(countdownLine(id, wait));
        }

        if (answer !== null) {
          // The timeout result is the tool's own JSON; the note above is its sentence.
          if (!timedOut) card.append(el('div', 'ask-answer plain', answer));
          return card;
        }

        if (sent) {
          card.append(el('div', 'ask-state', t('ask.sent')));
        } else if (mode === 'button' && selections.length) {
          const row = el('div', 'ask-choices');
          for (const choice of selections) {
            const button = el('button', 'ask-choice', choice);
            button.type = 'button';
            button.addEventListener('click', () => void answerAsk(id, choice));
            row.append(button);
          }
          card.append(row);
        } else {
          const form = el('form', 'ask-form');
          const box = el('textarea', 'ask-text');
          box.rows = 1;
          box.dataset.askId = id;
          box.placeholder = t('ask.placeholder');
          box.value = askDrafts.get(id) ?? '';
          const button = el('button', 'ask-send', t('ask.send'));
          button.type = 'submit';
          form.append(box, button);
          const submitAnswer = (event) => {
            event.preventDefault();
            void answerAsk(id, box.value);
          };
          form.addEventListener('submit', submitAnswer);
          box.addEventListener('input', () => {
            askDrafts.set(id, box.value);
            growText(box);
          });
          box.addEventListener('keydown', (event) => {
            if (!composing(event) && event.key === 'Enter' && !event.shiftKey) submitAnswer(event);
          });
          card.append(form);
        }
        if (askError.has(id)) card.append(el('div', 'ask-state error', askError.get(id)));
        return card;
      }

      // The answer goes back through the same POST /call as the rest of the page. The card stays
      // inert until the transcript shows the result, so a slow round cannot be answered twice.
      async function answerAsk(id, value) {
        const answer = String(value ?? '').trim();
        if (answer === '' || askSent.has(id)) return;
        askSent.add(id);
        askError.delete(id);
        askDrafts.delete(id);
        renderTranscript();
        const reply = await call(`${NODE}.answer`, forAgent({ id, answer }));
        if (!reply.ok) {
          askSent.delete(id);
          askError.set(id, reply.error ?? t('ask.refused'));
        }
        await load();
      }

      // Grow a textarea to its content; the CSS `max-height` is what stops it and starts the scroll.
      // The inline px is a measurement of one moment, though: turn the phone, open the keyboard, let
      // the URL bar collapse or drag the shell's splitter and the same text wraps into a different
      // number of lines while the px stays — a box left taller than its text, with blank space in it,
      // until the next keystroke. So the cap is read as the px it is right now and the measurement is
      // taken again whenever the box the page is drawn in changes (see regrowBoxes below).
      function growText(box) {
        box.style.height = 'auto';
        if (!box.isConnected) return;
        if (box.value === '') {
          box.style.height = ''; // empty: the stylesheet's one line (and its min-height) is the truth
          return;
        }
        const cap = parseFloat(getComputedStyle(box).maxHeight);
        const wanted = Number.isFinite(cap) ? Math.min(box.scrollHeight, cap) : box.scrollHeight;
        box.style.height = `${wanted}px`;
      }

      // A resize is the phone turning, the keyboard opening or the URL bar collapsing: all three
      // re-wrap the text and change how much of the screen is left, so every box measures itself
      // again. visualViewport is the one that fires for the keyboard where it exists; resize and
      // orientationchange cover the rest, this page's own frame included.
      function regrowBoxes() {
        for (const box of [input, ...log.querySelectorAll('textarea')]) growText(box);
      }

      // A repaint re-creates every box, so what was typed into a card is put back afterwards: a
      // question can sit on screen for minutes, and losing a keystroke to an unrelated event is a
      // bug worth preventing.
      function captureAskDrafts() {
        for (const box of log.querySelectorAll('.ask-text')) {
          if (box.value !== '') askDrafts.set(box.dataset.askId, box.value);
        }
        const active = document.activeElement;
        askFocus = active?.classList?.contains('ask-text')
          ? { id: active.dataset.askId, caret: active.selectionStart }
          : null;
      }

      function restoreAskDrafts() {
        for (const box of log.querySelectorAll('.ask-text')) {
          const draft = askDrafts.get(box.dataset.askId);
          if (draft) {
            box.value = draft;
            growText(box);
          }
        }
        if (askFocus === null) return;
        const focused = [...log.querySelectorAll('.ask-text')].find(
          (box) => box.dataset.askId === askFocus.id,
        );
        if (focused) {
          focused.focus();
          focused.setSelectionRange(askFocus.caret, askFocus.caret);
        }
      }

      function scrollToAsk() {
        if (askScrollTo === null) return false;
        const card = [...log.querySelectorAll('.ask')].find(
          (box) => box.dataset.askId === askScrollTo,
        );
        if (!card) return false;
        askScrollTo = null;
        card.scrollIntoView({ block: 'nearest' });
        return true;
      }

      function toolRound(msg, results, live = false, stillRunning = false, id = 'think') {
        const box = el('article', 'tool-round');
        // The label row carries what the turn cost; the round's own time rides at the end of the box with
        // the copy button, like any other message. The thinking follows `live` and is named by `id`.
        box.append(roleLine(roles().assistant, msg));
        if (msg.reasoning_content) box.append(thinking(msg.reasoning_content, live, id));

        // A message's prose is not optional just because it also carries tool calls: a model that says
        // "let me look at the file" and then calls a tool used to lose the sentence entirely. Drawn with
        // the same folding any other answer gets; only the thinking follows `live`, so the prose is not
        // marked as the streaming tail.
        if (msg.content) box.append(...responseParts(msg.content, false));

        const remaining = [...results];
        for (const call of msg.tool_calls) {
          const resultIndex = remaining.findIndex((result) => result.tool_call_id === call.id);
          const result = resultIndex === -1 ? null : remaining.splice(resultIndex, 1)[0];

          // ask_user is the one call that waits for the reader: it gets a card, not a fold.
          if (call.function?.name === ASK_TOOL) {
            box.append(askCard(call, result));
            continue;
          }

          let args = call.function.arguments;
          try {
            args = JSON.stringify(JSON.parse(args), null, 2);
          } catch {}

          const heading = toolHeading(call);
          const running = result === null && stillRunning;
          const card = el('details', 'call');
          // Both halves of a call can be taken away: the arguments as the model wrote them, and what the
          // call answered. Each button sits under the text it copies, with the section that names it.
          card.append(
            foldHeading(heading.label, heading.detail),
            withCopy(
              section(t('call.arguments'), el('div', 'plain', args)),
              args,
              t('copy.arguments'),
            ),
          );
          if (result) {
            card.append(
              withCopy(
                section(t('call.result'), el('div', 'plain', result.content ?? '')),
                result.content,
                t('copy.result'),
              ),
            );
          }
          // Never a result the page does not have: an unanswered call says exactly that.
          else if (!running) card.append(el('div', 'plain', t('call.noResult')));
          box.append(fold(card, false, call.id));
        }
        for (const result of remaining) {
          box.append(
            withCopy(
              foldedTool('tool', roles().tool, result.content ?? ''),
              result.content,
              t('copy.result'),
            ),
          );
        }
        // The round's last line: when it finished and how long it took, and the way to take its prose away —
        // at the end of the round, under the calls it made, because that is where the round ends.
        const foot = messageFoot(msg, msg.content, t('copy.thisMessage'));
        if (foot) box.append(foot);
        return box;
      }

      // An overlong answer folds along its own headings. Every heading is a folding point, so the
      // outline stays readable and no prose is cut in half; an answer without headings cannot be
      // folded by structure, so it folds its tail instead and keeps the opening.
      function responseParts(source, streaming) {
        const text = String(source ?? '');
        const tree = outline(text);
        if (tree.parts.some((part) => part.section)) {
          const foldLevel = foldLevelFor(tree);
          return foldLevel === null
            ? [renderMarkdown(text)]
            : renderOutline(tree.parts, foldLevel, streaming);
        }

        const cut = responseCut(text);
        if (cut >= text.length) return [renderMarkdown(text)];

        const hidden = text.slice(cut);
        const box = fold(el('details', 'long'), Boolean(streaming), 'tail');
        const summary = el('summary');
        summary.append(
          el('span', 'long-label', t('fold.showRest', { count: hidden.length })),
          el('span', 'long-text', hidden.replace(/\s+/g, ' ').trim().slice(0, 160)),
        );
        box.append(summary, renderMarkdown(hidden));

        const head = text.slice(0, cut);
        return head.trim() ? [renderMarkdown(head), box] : [box];
      }

      // Parse Markdown into a heading tree. A section holds its body in document order, so any
      // prose that follows a subsection stays where it was written. Headings inside a fence are
      // code, not structure.
      function outline(source) {
        const root = { level: 0, heading: null, parts: [] };
        const stack = [root];
        let fenced = false;

        for (const line of source.split('\n')) {
          if (/^[ \t]*(```|~~~)/.test(line)) fenced = !fenced;
          const heading = fenced ? null : line.match(/^(#{1,6})\s+(.*)$/);

          if (!heading) {
            const section = stack[stack.length - 1];
            const last = section.parts[section.parts.length - 1];
            if (last?.text) last.text.push(line);
            else section.parts.push({ text: [line] });
            continue;
          }

          const level = heading[1].length;
          while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
          const section = { level, heading: heading[2].trim(), parts: [] };
          stack[stack.length - 1].parts.push({ section });
          stack.push(section);
        }
        return root;
      }

      // What stays on screen when everything at foldLevel and deeper collapses: each folded section
      // shrinks to its heading line.
      function visibleSize(parts, foldLevel) {
        let lines = 0;
        let chars = 0;
        for (const part of parts) {
          if (!part.section) {
            lines += part.text.length;
            chars += part.text.join('\n').length;
            continue;
          }
          const { level, heading, parts: inner } = part.section;
          if (level >= foldLevel) {
            lines += 1;
            chars += heading.length;
          } else {
            const below = visibleSize(inner, foldLevel);
            lines += below.lines + 1;
            chars += below.chars + heading.length;
          }
        }
        return { lines, chars };
      }

      // Fold the deepest level first — four, then three, then two, then one — and keep the first
      // level that brings what remains inside the budget. null means nothing needs folding.
      function foldLevelFor(tree) {
        const fits = (level) => {
          const { lines, chars } = visibleSize(tree.parts, level);
          return lines <= RESPONSE_FOLD_LINES && chars <= RESPONSE_FOLD_CHARS;
        };
        if (fits(Infinity)) return null;
        for (const level of [4, 3, 2, 1]) if (fits(level)) return level;
        return 1;
      }

      // Render an outline with every section at foldLevel or deeper collapsed. A folded section
      // keeps its heading on screen, drawn in heading format, and reveals its own prose and any
      // deeper sections, themselves folded the same way.
      function renderOutline(parts, foldLevel, streaming) {
        const nodes = [];
        for (const part of parts) {
          if (!part.section) {
            const chunk = part.text.join('\n');
            if (chunk.trim()) nodes.push(renderMarkdown(chunk));
            continue;
          }

          const { level, heading, parts: inner } = part.section;
          const title = renderMarkdown(`${'#'.repeat(level)} ${heading}`);
          if (level >= foldLevel) {
            const box = fold(
              el('details', 'long head'),
              Boolean(streaming),
              `head:${level}:${heading}`,
            );
            const summary = el('summary');
            summary.append(title);
            box.append(summary, ...renderOutline(inner, foldLevel, false));
            nodes.push(box);
          } else {
            nodes.push(title, ...renderOutline(inner, foldLevel, streaming));
          }
        }
        return nodes;
      }

      // Where a headingless answer is trimmed: the opening stays up to the budget and the rest
      // folds. The cut prefers a line boundary, then a word boundary, and backs out of a fenced
      // code block, so both pieces still render as Markdown.
      function responseCut(source) {
        const lines = source.split('\n');

        const lineCut =
          lines.length > RESPONSE_FOLD_LINES
            ? lines.slice(0, RESPONSE_FOLD_LINES).join('\n').length + 1
            : source.length;

        const budget = Math.min(source.length, RESPONSE_FOLD_CHARS);
        const newline = source.lastIndexOf('\n', budget);
        const space = source.lastIndexOf(' ', budget);
        const charCut =
          source.length <= RESPONSE_FOLD_CHARS
            ? source.length
            : newline !== -1
              ? newline + 1
              : space !== -1
                ? space + 1
                : budget;

        let cut = Math.min(charCut, lineCut);

        // A cut inside a ``` block would split it, so it backs out to the block's opening line. A
        // block too big for the whole budget therefore folds away as one unit.
        let fenced = false;
        let opened = 0;
        let offset = 0;
        for (const line of lines) {
          if (offset >= cut) break;
          if (/^[ \t]*(```|~~~)/.test(line)) {
            if (!fenced) opened = offset;
            fenced = !fenced;
          }
          offset += line.length + 1;
        }
        if (fenced) cut = opened;
        return Math.max(cut, 0);
      }

      // One message -> one or more boxes. Tool activity is literal and folded by default;
      // assistant prose is Markdown.
      function boxes(msg, streaming = false, id = 'think') {
        const thought =
          msg.role === 'assistant' && msg.reasoning_content
            ? [thinking(msg.reasoning_content, streaming, id)]
            : [];
        if (msg.tool_calls?.length) return [toolRound(msg, [], streaming, busy(), id)];
        if (msg.role === 'tool')
          return [
            withCopy(
              foldedTool('tool', roles().tool, msg.content ?? ''),
              msg.content,
              t('copy.result'),
            ),
          ];

        const box = el('article', `msg ${msg.role}`);
        // A pushed message is unwrapped first: the envelope names who sent it, the body is the message —
        // and what is copied is the body, the same text the reader sees.
        const pushed = msg.role === 'user' ? splitPushMeta(msg.content) : null;
        const body = pushed ? pushed.body : (msg.content ?? '');
        const content =
          msg.role === 'assistant' ? responseParts(body, streaming) : [el('div', 'plain', body)];
        box.append(roleLine(roles()[msg.role] ?? msg.role, msg, pushed), ...thought, ...content);
        // The end of the message: its time and the way to copy it, as one row (see `messageFoot`).
        const foot = messageFoot(msg, body, t('copy.thisMessage'));
        if (foot) box.append(foot);
        return [box];
      }

      // The transcript as boxes to keep or rebuild: one entry per top-level box, holding the messages
      // it was drawn from and how to draw it. Entries are compared by message identity, so a paint
      // rebuilds only the boxes whose messages are new — in practice the streaming tail, and nothing
      // else, however long the conversation has grown.
      function transcriptGroups(lines, streaming) {
        const groups = [];
        for (let index = 0; index < lines.length; index += 1) {
          const msg = lines[index];
          if (!msg.tool_calls?.length) {
            const live = streaming && index === lines.length - 1;
            groups.push({
              key: `m${index}`,
              refs: [msg],
              live,
              draw: () => boxes(msg, live, `m${index}`),
            });
            continue;
          }

          const results = [];
          while (lines[index + 1]?.role === 'tool') {
            results.push(lines[++index]);
            // A call that has its result is not one the page is waiting on any more.
            waitSince.delete(lines[index].tool_call_id);
          }
          // A streaming snapshot can carry tool calls before any result answers them: that round is
          // the live tail too, and its thinking opens with it. Whether anything is drawn after it
          // decides whether its unanswered calls are still running: a round the transcript has moved
          // past gets no result, so the page stops saying it is calling.
          const movedOn = index + 1 < lines.length;
          const live = streaming && index === lines.length - 1;
          groups.push({
            key: `t${index}`,
            refs: [msg, ...results],
            movedOn,
            waiting: stillWaiting(msg.tool_calls, results, movedOn),
            live,
            draw: (waiting) => [toolRound(msg, results, live, waiting, `t${index}`)],
          });
        }
        return groups;
      }

      function emptyGroup() {
        const box = el('div', 'empty');
        box.append(
          el('strong', null, t('empty.title')),
          document.createTextNode(t('empty.text')),
        );
        return { key: 'empty', refs: [], live: false, draw: () => [box] };
      }

      /** The line under the transcript: what the node says it is doing, not what the page guesses from
       *  the newest snapshot — the node knows whether it is writing, thinking or running a tool. */
      function agentLine() {
        const state = agentStatus?.state;
        if (typeof state !== 'string' || state === 'idle') return null;
        return stateLabel(state);
      }

      // Every <details> under #log, with the key its state is remembered by: the key of the box that
      // owns it, plus either the fold's own name or its position inside that box.
      function foldEntries() {
        const found = [];
        const walk = (node, owner, path) => {
          let index = 0;
          for (const child of node.children) {
            const key = path === '' ? `${index}` : `${path}.${index}`;
            const group = child.dataset.group ?? owner;
            const here = child.dataset.group ? '' : key;
            if (child.tagName === 'DETAILS')
              found.push([child, `${group}|${child.dataset.foldId ?? here}`]);
            walk(child, group, here);
            index += 1;
          }
        };
        walk(log, 'log', '');
        return found;
      }

      // What the reader folded open or shut themselves: a fold whose state differs from the one its
      // builder drew. Read before the paint, because the paint is what destroys the evidence.
      function rememberFolds() {
        for (const [box, key] of foldEntries()) {
          // A thinking keeps its own record (`openedThinking`), written by the click.
          if (box.dataset.thinkId) continue;
          if (box.open === (box.dataset.fold === '1')) foldChoices.delete(key);
          else foldChoices.set(key, box.open);
        }
      }

      // Put those choices back on the boxes just drawn, and forget the ones whose box is gone.
      function applyFolds() {
        const kept = new Set();
        for (const [box, key] of foldEntries()) {
          kept.add(key);
          const remembered = box.dataset.thinkId
            ? openedThinking.get(box.dataset.thinkId)
            : undefined;
          box.open = remembered ?? foldChoices.get(key) ?? box.dataset.fold === '1';
        }
        for (const key of foldChoices.keys()) if (!kept.has(key)) foldChoices.delete(key);
      }

      // The body a thinking scrolls in: the fold's second child, after its summary. Both of the two rules
      // below read it, one before the paint and one after.
      const thinkingBody = (box) => box.children[1];

      // What the reader scrolled a thinking's body to. A body at its own end is following the reasoning
      // and keeps no place of its own, so the follow below carries on; one anywhere else is being read,
      // and that place is theirs to keep. Read before the paint, like the folds.
      function rememberThinkingScroll() {
        for (const [box] of foldEntries()) {
          const id = box.dataset.thinkId;
          if (id === undefined || !box.open) continue;
          const body = thinkingBody(box);
          if (body.scrollTop + body.clientHeight >= body.scrollHeight - 40)
            thinkingScroll.delete(id);
          else thinkingScroll.set(id, body.scrollTop);
        }
      }

      // A thinking is capped, so the reasoning arriving past the cap is out of sight unless the body
      // itself is put at its own end: the reader watches the newest line, and the page under the box is
      // not asked to move for it — that is what keeps a long thinking from pushing the answer away.
      function followThinking() {
        for (const [box] of foldEntries()) {
          const id = box.dataset.thinkId;
          if (id === undefined || !box.open) continue;
          const body = thinkingBody(box);
          body.scrollTop = thinkingScroll.get(id) ?? body.scrollHeight;
        }
      }

      // The status line is one element, moved rather than re-created, so a paint never has to look
      // for it among the boxes.

      //: The two words for a turn the loop is in the middle of. `stopping` is the third and is neither
      //: running nor idle: the turn is there, but it is already being cut short.
      const RUNNING_STATES = ['generating', 'tool'];

      /** What Send and Stop are drawn from: the node's own word for what it is doing — `generating`,
       *  `tool`, `stopping` or `idle`. Until a status has been read (the page is drawn before its first
       *  `agent.status` comes back) it falls back to what the page knows by itself, so a first screen
       *  with a snapshot already in hand shows Stop rather than a Send that would open a second turn. Any
       *  other word — a newer node, a state this page has not been taught — is drawn like a turn in
       *  progress: a Send that cannot be pressed is the safe mistake. */
      function controlState() {
        const state = agentStatus?.state;
        if (typeof state === 'string') return state;
        return busy() ? 'generating' : 'idle';
      }

      // Send and Stop are drawn from `controlState()`, never toggled by hand: while the model works the
      // input is closed and Stop is what is left (the turn is the node's — this page only queued the
      // line — and only the node can cut it short), and between turns it is the other way round. A turn
      // being stopped is the third case and has neither: Stop is gone because pressing it again asks the
      // node for the same thing twice, and Send stays closed until the node says `idle`, because that
      // turn is still holding the loop.
      // Drawing both controls here — on every paint, including the one that opens the page — is what
      // keeps them from disagreeing with each other: a page that repainted mid-answer used to offer
      // Send, and Stop could not come back at all because only `sendText` ever touched it.
      function renderControls() {
        const state = controlState();
        const running = RUNNING_STATES.includes(state);
        const closed = state !== 'idle';
        send.disabled = closed;
        send.textContent = closed ? '…' : '↑';
        if (closed) send.setAttribute('aria-busy', 'true');

        stop.hidden = !running;
        stop.disabled = !running;

      // folds, its selection and its place, because it is never removed or re-inserted.
      function paint(groups) {
        const wanted = new Set(groups.map((group) => group.node));
        let index = 0;
        for (const group of groups) {
          while (
            log.children[index] &&
            log.children[index] !== statusLine &&
            !wanted.has(log.children[index])
          ) {
            log.children[index].remove();
          }
          if (log.children[index] !== group.node)
            log.insertBefore(group.node, log.children[index] ?? null);
          index += 1;
        }
        while (log.children[index] && log.children[index] !== statusLine)
          log.children[index].remove();
      }

      function renderTranscript() {
        // First, and before the early return below: the controls follow the model status, not the boxes,
        // so a paint that has nothing to redraw still has to put them right. They are the chrome of
        // the page on screen, so a paint of a hidden page leaves them alone.
        if (current === pages.get(currentAgent)) renderControls();
        const shown = streamingMessage === null ? messages : [...messages, streamingMessage];
        const status = agentLine();
        const asks = `${[...askSent].join(',')}|${[...askError.keys()].join(',')}|${[...liveAsks].join(',')}|${[...askTimedOut].join(',')}`;
        // A question's badge and countdown are not in the transcript, so a reload that brings back the
        // same lines would keep the box they were drawn in — saying the state they had then. When that

              (group.live && JSON.stringify(previous.refs) === JSON.stringify(group.refs)));

            refs: group.refs,
            live: group.live,

            waiting: group.waiting,
            node,

        });

        // reloads are: an entry is the box the page already has unless its message changed.
        const same =

        // unusable. So the follow only happens when the reader is already at the bottom, and it
        // never animates — while it runs, an animated scroll would be re-aimed every snapshot and
        // would never arrive. A window that was just opened lands there instead of travelling
        // there, and then hands the reader a log that is already in place.

        // has no bottom to land on, and must not spend the flag the window that is about to arrive
        // needs.
        const land = landAtBottom && messages.length > 0;
        if (land) landAtBottom = false;
        log.classList.toggle('following', land || (streamingMessage !== null && atBottom));
        // A question that just arrived wins over the usual "follow the tail".
        if (!scrollToAsk() && (land || atBottom)) log.scrollTop = log.scrollHeight;
        // A window shorter than the log has nothing to scroll, and a reader cannot scroll up to what
        // does not scroll: ask for the page before it, once per paint, until the log overflows. A log
        // with no height yet is one the browser has not laid out (or a stand-in that has no layout at
        // all), and measuring it says nothing.
        if (
          !loadingOlder &&
          log.clientHeight > 0 &&
          historyFrom > 0 &&
          log.scrollHeight <= log.clientHeight
