<!doctype html>
<html lang="en">
  <head>
    <script src="/webui/events-client.js"></script>
    <script src="/webui/events-broker.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Where this node's words go: `paintPage` fills the slot with the resource the markers below
         are read from, and the browser half reads it back out of the page. -->
    <!-- node-agent:i18n-resource -->
    <script type="module" src="/sdk/i18n-client.js"></script>
    <link id="favicon" rel="icon" type="image/svg+xml" />
    <title data-text-key="title">Agent · node_agent</title>
    <script>
      // Inside the webui shell this page is an iframe, and then it has to fill the FRAME it was given
      // rather than the window: the height chain below reads this class. It is set before the style is
      // parsed, so nothing is ever laid out at the wrong height and no strip of blank flashes under the
      // composer. `self !== top` is true for a frame and safe to ask anywhere (it never throws).
      if (self !== top) document.documentElement.classList.add('framed');
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --text: #172033;
        --muted: #667085;
        --line: #e2e8f0;
        --accent: #5b5bd6;
        --accent-fill: #5b5bd6;
        --accent-dark: #4747ba;
        --accent-soft: #eeeeff;
        --danger: #dc2626;
        --shadow: 0 8px 30px rgb(15 23 42 / 7%);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0d111b;
          --surface: #151b28;
          --surface-soft: #101622;
          --text: #e6eaf2;
          --muted: #929bad;
          --line: #293246;
          --accent: #8b8cf5;
          --accent-fill: #4b4bc4;
          --accent-dark: #a5a6ff;
          --accent-soft: #29294f;
          --danger: #f87171;
          --shadow: 0 8px 30px rgb(0 0 0 / 20%);
        }
      }
      * {
        box-sizing: border-box;
      }
      /* What the page fills: the viewport when it is the top document, the frame box inside the webui
         shell. Both are the initial containing block, which is exactly what 100% means here. */
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.6 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #provider-switch {
        width: auto;
        min-width: 104px;
        max-width: min(180px, 54vw);
        height: 26px;
        padding: 0 25px 0 8px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 7px;
        outline: 0;
        background: var(--surface-2);
        color: var(--text);
        font: inherit;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }
      #provider-switch:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #provider-switch:focus-visible {
        border-color: var(--accent);
      }
      .usage-summary {
        display: flex;
        /* `nowrap` on purpose: a wrapped row is what dropped the switch to a line of its own. Down
           here the switch keeps its place and the group of counts, which may wrap inside itself,
           pays for the width. */
        flex-wrap: nowrap;
        align-items: center;
        gap: 2px 10px;
        padding: 5px clamp(14px, 3vw, 26px) 7px;
        border-top: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        font-size: 10px;
        line-height: 1.5;
      }
      .usage-summary strong {
        color: var(--text);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .usage-summary span {
        white-space: nowrap;
      }
      /* The counts are one group and the switch is the other: the numbers on the left, `| provider` at
         the row's right end, a hairline where the numbers stop. The group is what gives way, never the
         switch — on a narrow row the numbers wrap among themselves, so the switch stays on the line and
         in its corner instead of dropping to one of its own. */
      .usage-counts {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px 10px;
        min-width: 0; /* a flex item's floor is its content, which would starve the switch */
      }
      .usage-provider {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 6px;
        margin-left: auto; /* the row's right end, at every width */
        padding-left: 10px;
        border-left: 1px solid var(--line);
      }
      .usage-provider .provider-label {
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.04em;
      }
      /* A message's own token usage is one more item on the label row (see .role), so it carries no
         margin of its own and undoes the label's small caps: it is numbers a reader reads as written. */
      .token-usage {
        color: var(--muted);
        font:
          11px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
        letter-spacing: normal;
        text-transform: none;
        white-space: normal;
      }
      /* When a message finished, at the left of its last row: the same small muted voice as the usage up
         top, because it is the smallest fact about the message. A transcript written before the node
         stamped its lines has no time, and then the row holds the copy button alone. */
      .msg-time {
        color: var(--muted);
        font:
          11px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
        letter-spacing: normal;
        text-transform: none;
        white-space: nowrap;
      }
      /* The pages of every agent the node runs, one on top of the other: the one on screen is the
         one not `hidden`, and the others keep their boxes (and their scroll) out of the way. */
      .pages {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .agent-page {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        min-height: 0;
      }
      .agent-page[hidden] {
        display: none;
      }
      main {
        flex: 1;
        /* min-height:0 is what lets a scrolling flex child shrink: with the default `auto` the
           transcript's own height wins, the column overflows and the composer is pushed past the
           bottom of the screen instead of the log scrolling. */
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 24px clamp(14px, 4vw, 36px) 30px;
        scroll-behavior: smooth;
        scrollbar-gutter: stable;
      }
      /* While the tail is being followed the scroll has to land where it is put: a smooth scroll that
         a streamed snapshot re-aims 20 times a second never arrives, and the reader cannot move. */
      main.following {
        scroll-behavior: auto;
      }
      /* The line above the transcript, outside `main` on purpose: main's children are the transcript's
         boxes, and the page paints them by position. It keeps its height while hidden, so a page that
         has nothing to say does not push the transcript down. */
      .older-status {
        padding: 0 clamp(14px, 4vw, 36px);
        font-size: 12px;
        line-height: 18px;
        color: var(--muted);
        text-align: center;
      }
      /* Which agent the page is looking at: one button per agent the node runs, the main one first.
         The row is only there when there is a choice to make - a node with no sub-agents draws no
         row at all, and the page looks exactly as it did before there were any. */
      .agents {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 6px clamp(14px, 4vw, 36px) 0;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .agents[hidden] {
        display: none;
      }
      .agent-tab {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        width: auto;
        height: 24px;
        min-width: 0;
        padding: 0 9px;
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 11px;
        line-height: 22px;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }
      .agent-tab:hover {
        color: var(--text);
        background: var(--surface-2);
      }
      .agent-tab.current {
        border-color: var(--line);
        background: var(--surface-2);
        color: var(--text);
        font-weight: 600;
      }
      .agent-tab[data-busy='true'] {
        animation: agent-breathe 1.2s ease-in-out infinite;
      }
      .agent-tab[data-busy='true'][data-state='stopping'] {
        animation-name: agent-breathe-stop;
      }
      @keyframes agent-breathe {
        0%,
        100% {
          border-color: rgb(34 197 94 / 20%);
        }
        50% {
          border-color: rgb(34 197 94 / 90%);
        }
      }
      @keyframes agent-breathe-stop {
        0%,
        100% {
          border-color: rgb(245 158 11 / 20%);
        }
        50% {
          border-color: rgb(245 158 11 / 90%);
        }
      }
      .agent-tab:focus-visible {
        border-color: var(--accent);
        outline: 0;
      }
      .agent-icon {
        display: inline-flex;
        flex: none;
        width: 14px;
        height: 14px;
      }
      .agent-icon svg {
        display: block;
        width: 14px;
        height: 14px;
      }
      /* What a right click on a sub-agent's tab offers: one menu, drawn over the page at the
         pointer, with the things this page can do to that agent. It is `fixed` because the row it
         belongs to scrolls away under it, and it is hidden until a sub-agent's tab is right
         clicked - the main agent cannot be destroyed, so it has no menu at all. */
      .agent-menu {
        position: fixed;
        z-index: 40;
        min-width: 132px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .agent-menu[hidden] {
        display: none;
      }
      .agent-menu-item {
        display: block;
        width: 100%;
        height: 26px;
        padding: 0 9px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--danger);
        font: inherit;
        font-size: 12px;
        text-align: left;
        cursor: pointer;
      }
      .agent-menu-item:hover,
      .agent-menu-item:focus-visible {
        background: color-mix(in srgb, var(--danger) 12%, transparent);
        outline: 0;
      }
      .agent-menu-item[disabled] {
        color: var(--muted);
        cursor: default;
      }
      /* The second question a delete asks, over the page it is about: the row the reader pressed is
         still there until they say yes, and the dialog is the one thing a press can land on. */
      .agent-confirm {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgb(15 23 42 / 28%);
      }
      .agent-confirm[hidden] {
        display: none;
      }
      .agent-confirm-card {
        width: min(340px, 100%);
        padding: 16px 18px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .agent-confirm-card p {
        margin: 0 0 14px;
        font-size: 13px;
      }
      .agent-confirm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .agent-confirm-actions button {
        width: auto;
        height: 28px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .agent-confirm-actions .danger {
        border-color: transparent;
        background: var(--danger);
        color: #fff;
        font-weight: 600;
      }
      .empty {
        margin: auto;
        color: var(--muted);
        text-align: center;
      }
      .empty strong {
        display: block;
        color: var(--text);
        font-size: 18px;
      }
      .msg {
        max-width: min(88%, 78ch);
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 5px 16px 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow-wrap: anywhere;
      }
      .user {
        align-self: flex-end;
        border: 0;
        border-radius: 16px 16px 5px;
        background: linear-gradient(145deg, var(--accent), var(--accent-dark));
        color: white;
      }
      .assistant {
        align-self: flex-start;
      }
      .system {
        align-self: center;
        border-style: dashed;
        border-radius: 12px;
        background: transparent;
        box-shadow: none;
        color: var(--muted);
        font-size: 12px;
      }
      /* Tool activity and reasoning read alike: no bubble, no fill — just a folded small-caps title
         over a body indented by a rule. */
      .call,
      .tool,
      .think {
        margin-top: 7px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }
      .call,
      .tool {
        align-self: flex-start;
        max-width: min(88%, 78ch);
      }
      .think > summary,
      .call > summary,
      .tool > summary {
        cursor: pointer;
      }
      .call > summary,
      .tool > summary {
        overflow-wrap: anywhere;
      }
      /* A fold's summary is its label followed by what the fold is about; only the label span is a
         small-caps label, and the preview after it is content. The thinking's summary shows that
         preview on one ellipsised line, so a narrow screen never wraps it into a mess; the whole text
         lives in the body, which keeps today's styling. */
      .think > summary {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      /* What follows a label is content, not a label: it reads exactly as it was written, so a
         label's uppercase can never reach the thinking's own words or a tool's own name. */
      .fold-preview,
      .long-text,
      .plain,
      .markdown {
        text-transform: none;
      }
      .fold-preview {
        margin-left: 0.45em;
      }
      /* A fold's body: indented under a rule, whichever fold it belongs to. */
      .think .plain,
      .call > .section,
      .call > .plain,
      .tool > .plain {
        margin-top: 6px;
        padding-left: 0.85em;
        border-left: 3px solid var(--line);
      }
      .section + .section {
        margin-top: 6px;
      }
      .section-label {
        margin-bottom: 3px;
      }
      .tool-round {
        align-self: flex-start;
        max-width: min(88%, 78ch);
      }
      .tool-round > .call,
      .tool-round > .tool {
        max-width: 100%;
        margin-top: 6px;
      }

      /* The agent's `ask_user` tool is the one tool call that waits for the reader, so it is a real
         card — heading, body, and the controls the model asked for — rather than a fold. */
      .ask {
        width: 100%;
        max-width: 100%;
        padding: 13px 15px;
        border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
        border-left: 3px solid var(--accent);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .ask-badge {
        color: var(--accent-dark);
      }
      .ask-badge.error {
        color: #e5484d;
      }
      .ask-title {
        margin: 4px 0 0;
        font-size: 15px;
        line-height: 1.35;
      }
      .ask-body {
        margin-top: 7px;
        font-size: 13px;
      }
      /* Options flow, and a row that fills up wraps instead of running off the card: 8px apart in
         both directions, and a label too long for its row takes the whole row below. */
      .ask-choices {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      /* The composer's button is a 36px square; a card's controls are shaped like text instead. A
         choice's label is a sentence the model wrote, so it takes the card's width and wraps inside
         it: `max-width` is what lets a label longer than the row shrink at all — a flex item holds
         its own text's width otherwise and the card's overflow then cuts the words off — and
         `anywhere` breaks the one long run (a path, a CJK sentence) that has no space in it. Height
         stays `auto`: a wrapped label makes a taller button, never a smaller font. */
      .ask-choice,
      .ask-send {
        display: inline-flex;
        width: auto;
        height: auto;
        max-width: 100%;
        min-width: 0;
        align-items: center;
        padding: 7px 13px;
        white-space: normal;
        overflow-wrap: anywhere;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface-soft);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        line-height: 1.4;
      }
      .ask-choice:hover:not(:disabled) {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent-dark);
      }
      .ask-choice:disabled,
      .ask-send:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .ask-send {
        border-color: transparent;
        background: var(--accent);
        color: #fff;
      }
      .ask-send:hover:not(:disabled) {
        background: var(--accent-dark);
      }
      .ask-form {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      .ask-text {
        flex: 1;
        min-height: 38px;
        max-height: 140px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface-soft);
        color: inherit;
        font: inherit;
        font-size: 13px;
        resize: none;
      }
      .ask-text:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgb(91 91 214 / 12%);
      }
      .ask-state,
      .ask-answer,
      .ask-countdown {
        margin-top: 10px;
        color: var(--muted);
        font-size: 11px;
      }
      .ask-state.error {
        color: #e5484d;
      }
      /* The countdown's digits on a fixed grid: a line that loses a digit while the reader is reading
         it must not shift the questions under it. */
      .ask-countdown {
        font-variant-numeric: tabular-nums;
      }
      .ask-answer {
        padding: 9px 11px;
        border-left: 3px solid var(--accent);
        border-radius: 0 8px 8px 0;
        background: var(--surface-soft);
        color: var(--text);
        font-size: 13px;
      }
      .model-status {
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .model-status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        content: '';
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      /* The dot says "still running" by moving; a reader who asked for no motion still gets the dot,
         still, and the words beside it — so the two states are told apart without animation. */
      @media (prefers-reduced-motion: reduce) {
        .model-status::before {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
      /* Every small-caps label on the page is the same label: a role, a section, an ask badge. */
      .role,
      .section-label,
      .ask-badge,
      .long-label,
      .fold-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      /* The label row is a flex line because a message's own token usage sits on it: `AGENT`, then the
         counts for that turn. The row wraps, so a narrow bubble puts the usage under the label instead
         of squeezing it. A message with no usage (the reader's, a tool result) is only the label. */
      .role {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px 10px;
        margin-bottom: 5px;
        color: var(--muted);
        line-height: 1.3;
      }
      .user .role {
        color: rgb(255 255 255 / 72%);
      }
      /* The sender beside the role: the row's small caps stay on the role, the name is written the way it
         was given (a node name is a name), and it wraps rather than pushing a phone's bubble sideways. */
      .role .from {
        min-width: 0;
        max-width: 100%;
        font-weight: 600;
        letter-spacing: 0;
        text-transform: none;
        overflow-wrap: anywhere;
      }
      /* The middle dot between the role and the sender is punctuation, so it is drawn and not typed: a
         screen reader says "You, From timer", and no one has to hear the word "dot". */
      .role .from::before {
        content: '· ';
      }
      /* A message can be copied: one small button under the text it copies, right-aligned with it and
         quiet by default — a message is what the reader came for, not the button. Quiet, though, is
         not hidden, and not hover-only: a phone has no pointer to hover with, so the button is always
         there, on every device, at less than full opacity, and only how loudly it reads changes when it
         is hovered or reached by the keyboard. What it draws is a shape and not a word — the copy mark,
         a tick, a cross — so there is no text in it at all and its `aria-label` is what a screen reader
         has to go on. It has no background and no rounding of its own: the box is the hit area, the
         colour is whatever colour the text under it is, and nothing else about it is painted. */
      .copy {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        min-width: 24px;
        min-height: 24px;
        margin: 4px 0 0 auto;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        opacity: 0.45;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      /* The mark is smaller than the button it sits in: 12px of drawing in a 24px box — a 44px one on a
         phone — because at this size it is a hint beside the message, not a control to be read. It is
         drawn in `currentColor`, so it is the page's near-black where the page is light and turns light
         on a dark page, and it is never a colour of its own. Its classes are `copy-*` and not `mark*`,
         because `mark` names a badge: a copy mark wearing that class came out as a purple gradient
         chip with a white glyph on it, whatever the message under it was. */
      .copy svg {
        display: none;
        width: 12px;
        height: 12px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* Which of the three shapes is drawn is the button's own state and nothing else: the shape changes,
         the box does not, so nothing around it jumps when a copy lands. */
      .copy[data-state='copy'] .copy-mark {
        display: block;
      }
      .copy[data-state='copied'] .copy-ok {
        display: block;
      }
      .copy[data-state='failed'] .copy-no {
        display: block;
      }
      /* What a pointer or a keyboard has reached, and what the button shows while it has just copied
         something — or could not copy it: the shape answers, and it answers louder than it rests. */
      .copy:hover,
      .copy:focus-visible,
      .copy[data-state='copied'],
      .copy[data-state='failed'] {
        opacity: 0.9;
      }
      /* The last row of a message: when it finished and the way to take it away — the time on the left, the
         button at the right edge, one row and so one thing to a reader. It is the button's own auto margin
         that holds the right edge, and not `justify-content`, because a row can hold the button and nothing
         else — a transcript written before the node kept times, or a thinking, which has no time of its own —
         and a lone child of a `space-between` row would be pushed to the left, away from the text it copies.
         It rests invisible and comes back when the reader reaches for the message, and `opacity` rather than
         `display` is what keeps its place in the layout: revealing it moves nothing below it. A touch device
         has no hover to reach it with, so there the row is simply always there — see the `hover: none` query
         at the end of this sheet. */
      .msg-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
        opacity: 0;
        transition: opacity 0.15s;
      }
      /* Reaching for a message — with a pointer or with the keyboard — brings that row back, whichever
         kind of box holds it: a bubble, a round of tool calls, a thinking. Hovering the bubble counts for
         a row inside a fold in it, which is where a thinking's copy lives. */
      .msg:hover .msg-foot,
      .msg:focus-within .msg-foot,
      .tool-round:hover .msg-foot,
      .tool-round:focus-within .msg-foot,
      .think:hover .msg-foot,
      .think:focus-within .msg-foot {
        opacity: 1;
      }
      /* Inside that row the button keeps its size and colour but not the margins it uses when it stands
         alone under a section of text: the row is what places it. `margin-left: auto` is what holds it at
         the right edge whether or not a time came before it — which is the whole reason the row above does
         not say `space-between`. */
      .msg-foot > .copy {
        margin: 0 0 0 auto;
      }
      .plain {
        white-space: pre-wrap;
      }
      /* A reasoning model's thinking: collapsed by default, so it never pushes the answer away. A
         tool-call round has no bubble of its own, so the thinking sits on the log like one. */
      main > .think {
        align-self: flex-start;
        max-width: min(88%, 78ch);
      }
      /* An open thinking runs as long as the model keeps reasoning, and while the turn streams it keeps
         growing: capped and scrolled inside itself, it pushes nothing else, so the answer under it stays
         where the reader left it and the page keeps the scroll the reader gave it. The cap is a share of
         the box the page is drawn in — the shell's frame, a phone's screen — and not a count of pixels it
         would outgrow on a small one. The wheel is not contained here: past the end of the thinking it
         carries on into the transcript, so the box is a window onto the reasoning and never a scroll trap. */
      .think > .plain {
        max-height: min(320px, 45dvh);

      .long.head > summary .markdown h3,
      .long.head > summary .markdown h4,
      .long.head > summary .markdown h5,

      .markdown > :last-child {

         reader said and is still owed, not part of the transcript. */
      .queue {

        max-width: 900px;

        min-height: 32px;
        max-height: 140px;

        line-height: 1.5;

      textarea::placeholder {

      }

        display: grid;
        width: 36px;
        height: 36px;
        flex: 0 0 auto;
        place-items: center;
        border: 0;
        border-radius: 10px;
        background: var(--accent-fill);
        color: #fff;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        transition:
          transform 0.15s,
          opacity 0.15s;
      }

         is a hint beside a message and not a thing to press — the `:not(.copy)` is what says so, here,
         where the lift is set, rather than in a rule of its own that this one would come after. */
      button:hover:not(:disabled):not(.copy) {
        transform: translateY(-1px);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      /* `button` above sets `display: grid`, which would beat the `hidden` attribute — so hiding has
         to be said again here. The stop button is only in the flow while a turn is running. */
      button[hidden] {
        display: none;
      }
      button.stop {
        background: #e5484d;
        font-size: 13px;
      }
      /* A device with no pointer to hover with — a phone, most tablets — has no way to bring that last row
         back, so there it is not hidden at all. `hover: none` is exactly that device; `pointer: coarse` sits
         beside it for one that reports no hover and still has a pen, which is the same reader with the same
         problem. A pointer device keeps the quiet behaviour. */
      @media (hover: none), (pointer: coarse) {
        .msg-foot {
          opacity: 1;
        }
      }
      /* --- Mobile: a phone is one column read with a thumb, and the bottom of the screen belongs to
         the home indicator. The same block, with the same comment, is on every page of the web UI
         (README.md, "Mobile"): viewport-fit=cover in the meta, this media query, 44px targets,
         safe-area padding, and wrapping for long paths. --- */
      @media (max-width: 640px), (orientation: landscape) and (max-height: 480px) {
        /*100dvh, not100vh: a collapsing URL bar must not crop the composer. */
        body {
          height: 100dvh; /*viewport-fit=cover lets the page under the notch, so hand its sides back*/
          padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
        }
        main {
          padding: 16px 12px 20px;
        }
        /* The bubble's width is the scarce thing on a phone, so give it all of it. */
        .msg,
        .call,
        .tool,
        main > .think {
          max-width: 100%;
        }
        /* An open thinking takes less of the screen here than on a desk: the composer, its row and the
           usage row all live in the same box, and the reasoning still scrolls inside what is left. */
        .think > .plain {
          max-height: 38dvh;
        }
        /*44px is the smallest target a thumb hits reliably; the buttons are36px for a pointer. */
        button {
          width: 44px;
          height: 44px;
        }
        /* A thumb target, and thin: its width is what the numbers do not get on a 390px row. */
        #provider-switch {
          min-width: 0;
          max-width: min(180px, 42vw);
          height: 32px;
          padding: 0 18px 0 6px;
          font-size: 10px;
        }
        /* A card's choice is not a square, so the rule above leaves it at its text's height. One line of
           that is still a thumb target: 44px tall, and taller when the label wraps. */
        .ask-choice,
        .ask-send {
          min-height: 44px;
        }
        /* The copy button is a thumb target like the others — 44px across, not the 24px it rests at.
           Where that height comes from is said with the rules below, where the boxes that hold one live. */
        .copy {
          min-width: 44px;
          min-height: 44px;
        }
        /* A message's last row holds a thumb target, and it pays for that height out of the padding under
           the bubble instead of making every message a thumb taller: it hangs6px above where the row would
           sit and10px below, both inside the bubble's own padding. The same trick for a copy button that
           still stands alone — under a section of text, or on a folded tool result. The thinking's copy sits
           in the fold's body with its text, not under a bubble, so it pays for nothing. */
        .msg > .msg-foot,
        .tool-round > .msg-foot {
          margin: -6px 0 -10px;
        }
        .section > .copy,
        details.tool > .copy {
          margin: -6px 0 -10px auto;
        }
        /*16px stops iOS Safari from zooming the page in when the box takes focus. */
        textarea {
          min-width: 0; /* the box shrinks with the row instead of forcing a wider page */
          min-height: 44px;
          max-height: min(
            140px,
            30dvh
          ); /* in a frame dvh is the frame's height: a 213px frame must not try to hold a 140px box */
          font-size: 16px;
        }
        footer {
          padding-bottom: calc(14px + env(safe-area-inset-bottom));
        }
        /* A path or a URL in a tool body must break, not push the page sideways. */
        .plain {
          overflow-wrap: anywhere;
        }
      }
      /* Inside the shell's frame the box is the truth: 100% follows it. Chrome already answers
         `100dvh` with the frame's own viewport, but other engines (and old iOS Safari) answer with the
         *window's* height, which leaves the page taller than its frame and a strip of blank under the
         composer. This rule is after the phone block on purpose: in a frame it wins at every width. */
      :root.framed body {
        height: 100%;
        min-height: 0;
      }
      /* A phone held sideways has ~400px of height and the shell's bar takes a slice: the usage row gives
         up a little of its padding and type size, so the input still gets the rest. */
      @media (orientation: landscape) and (max-height: 480px) {
        .usage-summary {
          padding: 2px 12px 4px;
          font-size: 11px;
        }
      }
      /* A formula is an SVG that MathJax drew, and the page asked it for one formula at a time rather
         than for a typeset page (see `math-rules` below), so the stylesheet MathJax would have written
         beside the page is written here instead: the drawing sits on the line of the text it belongs to,
         a display formula is a block of its own that scrolls sideways rather than pushing the message
         wider than a phone, and nothing here is a rule about `.markdown` alone — a formula in a thinking,
         a tool result or a question's card is the same formula. */
      mjx-container[jax='SVG'] {
        display: inline-block;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
      }
      mjx-container[jax='SVG'] > svg {
        overflow: visible;
        min-width: 1px;
        min-height: 1px;
      }
      mjx-container[jax='SVG'][display='true'] {
        display: block;
        margin: 0.5em 0;
        text-align: center;
      }
      /* The one thing a formula with no renderer shows: the TeX the model wrote, as it wrote it. */
      .math-source {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.95em;
      }
    </style>

    <script id="math-rules">
      // Formulas. The TeX a model writes is drawn as an SVG by the page itself, one formula at a time,
      // while it builds a message: MathJax is asked for that drawing (`tex2svg`) and never asked to
      // typeset the page, so nothing here typesets a node twice and a repaint costs what the text
      // around it costs.
      //
      // What counts as a formula is decided by Markdown's own tokenizer: the two rules below are
      // markdown-it rules, so an inline code span, a fenced block and an indented block are already out
      // of reach — the tokenizer never offers them to an inline rule — and a formula in a table cell
      // or a list item takes the same path as one in a paragraph. `$$...$$` and `\[...\]` are display
      // formulas, `$...$` and `\(...\)` are inline ones. Raw HTML stays off (`html: false`), so
      // `<sub>x</sub>` is text with a formula in it or it is text, never markup.
      (function () {
        //: A drawing kept under its own TeX. A streaming answer is drawn again on every snapshot and
        //: most of it — every formula in it — is the same text it was a moment ago, so the drawing is
        //: made once and handed back.
        const DRAWN_MAX = 500;
        const drawn = new Map();
        //: Set when a formula had to be written as its own TeX because the renderer was not up yet.
        let waiting = false;
        /** The SVG MathJax draws for this TeX, as HTML — or `null` when it cannot draw it, which is
         *  either a renderer that has not started yet or one that refused, and the caller writes the
         *  TeX instead. A formula MathJax cannot read comes back drawn as the error it is: that is an
         *  answer, not a failure, and it is what keeps a half-typed formula from throwing its way out
         *  of a repaint. */
        function svg(tex, display) {
          const source = String(tex ?? '').trim();
          if (source === '') return null;
          const key = `${display ? 'D' : 'I'}${source}`;
          if (drawn.has(key)) return drawn.get(key);
          const MathJax = typeof window === 'undefined' ? null : window.MathJax;
          if (typeof MathJax?.tex2svg !== 'function') return null;
          let html = null;
          try {
            html = MathJax.tex2svg(source, { display })?.outerHTML ?? null;
          } catch (error) {
            console.warn('math:', error?.message ?? error);
            html = null;
          }
          if (typeof html !== 'string' || html === '') return null;
          if (drawn.size >= DRAWN_MAX) drawn.clear();
          drawn.set(key, html);
          return html;
        }
        /** Where the formula that opens just before `from` closes, or -1: `close` ends it, a dollar
         *  sign has to touch its formula at both ends (`it cost $5 and $6` is prose, not a formula),
         *  and no formula holds a blank line — a paragraph cannot be half a formula. */
        function closesAt(src, from, max, close) {
          for (let at = from; at < max; at += 1) {
            if (src.startsWith(close, at)) {
              const hugs =
                close !== '$' ||
                (at > from && !/\s/.test(src[at - 1]) && !/\d/.test(src[at + 1] ?? ''));
              if (hugs) return at;
              continue;
            }
            if (src[at] === '\n' && src[at + 1] === '\n') return -1;
            if (src[at] === '\\') at += 1; // an escape belongs to the formula: `\$` is a dollar sign
          }
          return -1;
        }

        /** `$...$`, `$$...$$`, `\(...\)` and `\[...\]` inside a line — a table cell and a list item
         *  are lines. */
        function inlineMath(state, silent) {
          const at = state.pos;
          const src = state.src;
          let open = '';
          let close = '';
          let display = false;
          if (src[at] === '$') {
            display = src[at + 1] === '$';
            open = display ? '$$' : '$';
            close = open;
          } else if (src.startsWith('\\(', at)) {
            open = '\\(';
            close = '\\)';
          } else if (src.startsWith('\\[', at)) {
            open = '\\[';
            close = '\\]';
            display = true;
          } else return false;
          const from = at + open.length;
          // `$ x$` is not a formula: the marker touches its TeX.
          if (from >= state.posMax || /\s/.test(src[from])) return false;
          const end = closesAt(src, from, state.posMax, close);
          if (end < 0 || src.slice(from, end).trim() === '') return false;
          if (!silent) {
            const token = state.push('math_inline', 'math', 0);
            token.content = src.slice(from, end);
            token.markup = open;
            token.meta = { display, open, close };
          }
          state.pos = end + close.length;
          return true;
        }
        /** `$$...$$` and `\[...\]` as a block of their own: a display formula written on its own
         *  lines, which is what a display formula is in practice. What shares its closing line is not
         *  part of it — `$$x$$ and the rest of the sentence` is a line with a formula in it, so it is
         *  left to the inline rule. */
        function blockMath(state, startLine, endLine, silent) {
          const start = state.bMarks[startLine] + state.tShift[startLine];
          const src = state.src;
          let open = '';
          let close = '';
          if (src.startsWith('$$', start)) open = close = '$$';
          else if (src.startsWith('\\[', start)) {
