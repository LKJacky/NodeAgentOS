          void loadOlder();
        }
      }

      // Snapshots arrive per token, and a paint per token is wasted work: the eye needs a frame, not
      // a token. So a burst of snapshots costs one paint, and the last one always lands.
      const RENDER_MS = 50;

      function scheduleRender(page = pages.get(currentAgent)) {
        if (page === undefined || page === null || page.renderTimer !== null) return;
        page.renderTimer = setTimeout(() => {
          page.renderTimer = null;
          requestAnimationFrame(() => withPage(page, renderTranscript));
        }, RENDER_MS);
      }

      /** The window a `history` answer carries, or null if the node answered with something else
       *  (one that has not been rebuilt since `history` learned to answer in windows). */
      function windowOf(reply) {
        const value = reply.ok ? reply.value : null;
        return value && Array.isArray(value.messages) && Number.isInteger(value.from)
          ? value
          : null;
      }

      // A bus may carry two provider nodes: `local-provider`, this stack's own endpoint, and
      // `provider`, the shared one. The page lists the rows of both at once and names each with the
      // node that holds it (`local-provider.fast`), because that full name is what a selection means
      // and what it sends back - a row belongs to one node, never to "whichever is nearer".
      const PROVIDER_NODES = ['local-provider', 'provider'];

      /** Every row on either provider node, each named with the node it lives on. A node that is not
       *  on the bus, or does not answer, simply has no rows here: the other one still lists. */
      async function providerNames() {
        const replies = await Promise.all(
          PROVIDER_NODES.map((node) => call(`${node}.providers`, { action: 'list' })),
        );
        return replies.flatMap((reply, at) => {
          if (!reply.ok) return [];
          const rows = reply.value?.providers || [];
          return rows.map(({ name }) => `${PROVIDER_NODES[at]}.${name}`);
        });
      }

      /** Which of `names` the agent's selection points at: the row itself when it is qualified, else
       *  the first row of that bare name, near node first - the rule the agent applies to a selection
       *  stored before local mode existed. '' when the selection names nothing that is there. */
      function activeRow(active, names) {
        if (names.includes(active)) return active;
        return names.find((name) => name.slice(name.indexOf('.') + 1) === active) || '';
      }

      /** The rows of the provider switch, one option each. A page keeps its own list: switching back
       *  to an agent shows the rows that agent had, without asking the provider nodes again. */
      function providerOptions(names) {
        return names.map((name) => {
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          return option;
        });
      }

      function showProviders(page) {
        providerSwitch.replaceChildren(...providerOptions(page.providers));
        providerSwitch.value = activeRow(page.activeProvider, page.providers);
        providerSwitch.disabled = page.providers.length === 0;
        providerSwitch.title =
          page.providers.length === 0 ? t('usage.noProviders') : t('usage.activeProvider');
      }

      /** The agent's own answer says which row it uses; the rows themselves come from the provider
       *  nodes, both of them, so a node the agent has not noticed yet still shows its rows here. */
      async function loadProviders(page = pages.get(currentAgent)) {
        if (page === undefined || page === null) return;
        const [reply, names] = await Promise.all([
          call(`${NODE}.provider`, agentArgs(page, { action: 'list' })),
          providerNames(),
        ]);
        if (names.length === 0) {
          page.providers = [];
          if (page === pages.get(currentAgent)) {
            providerSwitch.replaceChildren();
            providerSwitch.disabled = true;
            providerSwitch.title =
              (reply.ok ? t('usage.noProviders') : reply.error) || t('usage.providersFailed');
          }
          return;
        }
        page.providers = names;
        page.activeProvider = reply.ok ? reply.value?.active || '' : '';
        if (page === pages.get(currentAgent)) withPage(page, () => showProviders(page));
      }
      async function switchProvider() {
        const page = pages.get(currentAgent);
        if (page === undefined) return;
        const name = providerSwitch.value;
        const previous = activeRow(page.activeProvider, page.providers);
        if (!name || name === previous) return;
        providerSwitch.disabled = true;
        try {
          const reply = await call(`${NODE}.provider`, agentArgs(page, { action: 'select', name }));
          if (!reply.ok) {
            providerSwitch.value = previous;
            alert(t('usage.switchFailed', { error: reply.error }));
            return;
          }
          page.activeProvider = reply.value?.active || name;
          await loadProviders(page);
        } finally {
          providerSwitch.disabled = false;
        }
      }
      // A window read again is mostly messages the page already has, so the objects it drew for the
      // ones that did not change are kept: a re-read then costs only the boxes that are different,
      // exactly as a reload does. Compared by index in the node's transcript, which is what `from` is.
      function keepingDrawn(window) {
        if (historyFrom === null) return window;
        const had = new Map(messages.map((message, at) => [historyFrom + at, message]));
        return {
          ...window,
          messages: window.messages.map((message, at) => {
            const kept = had.get(window.from + at);
            return kept !== undefined && JSON.stringify(kept) === JSON.stringify(message)
              ? kept
              : message;
          }),
        };
      }

      // What the line above the log says, or nothing: empty text hides it, so the transcript keeps the
      // room the line would take only while there is something to say.
      function showOlder(text) {
        olderNote = text;
        older.textContent = text;
        older.hidden = text === '';
      }

      // The reader at the top wants the page before this window: one more `history` call, prepended,
      // with the scroll kept where it was — the page grew above the reader, not under them. The window
      // comes back starting where this one stops (`from`), so the two join without a gap, and a node
      // that had to cut the window to fit one bus frame just hands back fewer lines.
      async function loadOlder(page = pages.get(currentAgent)) {
        if (page === undefined || page === null) return;
        if (page.loadingOlder || page.historyFrom === null || page.historyFrom === 0) return;
        const version = page.loadVersion;
        page.loadingOlder = true;
        withPage(page, () => showOlder(t('older.loading')));
        try {
          const want = Math.max(0, page.historyFrom - HISTORY_PAGE);
          const reply = await call(
            `${NODE}.history`,
            agentArgs(page, { from: want, count: HISTORY_PAGE }),
          );
          if (version !== page.loadVersion) return;
          const answer = windowOf(reply);
          if (answer === null) {
            withPage(page, () => showOlder(t('older.failed')));
            return;
          }
          if (answer.messages.length === 0) {
            withPage(page, () => {
              page.historyFrom = answer.from;
              showOlder('');
            });
            return;
          }
          withPage(page, () => {
            const before = page.log.scrollHeight;
            page.messages = answer.messages.concat(page.messages);
            page.historyFrom = answer.from;
            renderTranscript();
            // The boxes went in above the reader: the scroll moves by as much as they added, so the
            // line the reader was looking at is the line they are looking at.
            const grew = page.log.scrollHeight - before;
            if (grew > 0) {
              const top = page.log.scrollTop + grew;
              if (typeof page.log.scrollTo === 'function') page.log.scrollTo({ top, behavior: 'instant' });
              else page.log.scrollTop = top;
            }
          });
        } finally {
          withPage(page, () => {
            if (page.olderNote === t('older.loading')) showOlder('');
            page.loadingOlder = false;
          });
        }
      }
      // A reload asks for what the page does not have: `from` follows the lines it already drew, so a
      // turn that adds one line fetches one line and redraws one box. A window that starts elsewhere is
      // a different transcript — a node that restarted, or another one in its place — so it is read
      // again from the top and replaces what the page had. Only the newest reload applies either way:
      // two of them would otherwise append the same lines twice.
      async function load(page = pages.get(currentAgent)) {
        if (page === undefined || page === null) return;
        const version = ++page.loadVersion;
        const asked = page.historyFrom === null ? null : page.historyFrom + page.messages.length;
        const [reply, statusReply] = await Promise.all([
          call(`${NODE}.history`, agentArgs(page, asked === null ? {} : { from: asked })),
          call(`${NODE}.status`, agentArgs(page, {})),
        ]);
        if (version !== page.loadVersion) return;
        if (statusReply.ok) renderStatus(page, statusReply.value);
        let answer = windowOf(reply);
        if (answer === null) return;

        const continues = asked !== null && answer.from === asked;
        if (asked !== null && !continues) {
          const again = await call(`${NODE}.history`, agentArgs(page, { count: HISTORY_PAGE }));
          if (version !== page.loadVersion) return;
          answer = windowOf(again);
          if (answer === null) return;
          answer = withPage(page, () => keepingDrawn(answer));
        }
        withPage(page, () => {
          messages = continues ? messages.concat(answer.messages) : answer.messages;
          // `from` is the index `messages[0]` holds, so it only becomes the page's own start when the
          // window *replaced* what the page had.
          if (!continues) historyFrom = answer.from;
          // A reload can land while snapshots are still coming in, so it queues up with them.
          scheduleRender(page);
        });
      }
      async function sendText() {
        const page = pages.get(currentAgent);
        if (page === undefined) return;
        const text = input.value.trim();
        if (text === '') return;
        input.value = '';
        growText(input);
        // Set before the POST goes out, so the button cannot be pressed twice, and cleared once the
        // node has said which turn the line is: only the queueing is what this page waits for.
        page.sending = true;
        withPage(page, renderTranscript);
        const posted = call(
          `${NODE}.chat_no_wait`,
          agentArgs(page, { msg: { role: 'user', content: text } }),
        );
        try {
          const reply = await posted;
          if (!reply.ok) alert(t('composer.failed', { error: reply.error }));
        } finally {
          // The node is the authority on what it is doing, and the line is already the turn's.
          await refreshStatus(page);
          page.sending = false;
          withPage(page, renderTranscript);
          input.focus();
          // The turn itself may have created or destroyed a sub-agent: the row is read again.
          void refreshAgents();
          // What the turn writes arrives as announced lines; this read makes sure the sentence the
          // reader just sent is on the page even if it were already in the transcript.
          await load(page);
        }
      }
      // Stopping is its own call and does not wait on the send above: it asks the node to cut its own
      // turn short. The node is the only one that can do it: the model request is on its side, not
      // this page's. The controls are not touched here either: the node answers with its stop marker,
      // and the next announced line or snapshot is what puts the buttons back.
      async function stopText() {
        const page = pages.get(currentAgent);
        if (page === undefined) return;
        await call(`${NODE}.stop`, agentArgs(page, {}));
        // The stop landed: the node is unwinding, and that is a state of its own.
        void refreshStatus(page);
      }
      send.addEventListener('click', sendText);
      stop.addEventListener('click', stopText);
      providerSwitch.addEventListener('change', switchProvider);
      input.addEventListener('input', () => growText(input));
      input.addEventListener('keydown', (e) => {
        if (!composing(e) && e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendText();
        }
      });
      // The three events that change the box this page is drawn in without anyone typing. `window`
      // is the object that has them in a browser, and the page test's stand-in gives it those names.
      window.addEventListener('resize', regrowBoxes);
      window.addEventListener('orientationchange', regrowBoxes);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', regrowBoxes);
      // The main agent's page is the first one - built, read and shown before anything else, so the
      // page the reader lands on is a page like any other. Every other agent gets one the moment the
      // list names it (`ensurePage` in `refreshAgents`), whether or not anyone looks at it.
      const opening = ensurePage(MAIN, MAIN);
      current = opening;
      opening.seen = true;
      opening.box.hidden = false;
      paintChrome(opening);
      void refreshAgents();

      // The state word, the queue and the state Send and Stop are drawn from are read from the node, but
      // only when something happened that can have changed them: a turn starting (the POST below), a
      // line announced or a stop asked for. A page between turns asks the node nothing.
      //
      // A fast model streams a snapshot per token, and every event is an invitation to read the state
      // again, so the reads are coalesced: one on its way at a time, plus one more when something arrived
      // while it was out. A whole answer therefore costs a read per round trip rather than a read per
      // snapshot — and because one read is always asked for after the last event, the word the page ends
      // on is the node's own (`idle` once the turn is over, `stopping` while it is unwinding).

      function refreshStatus(page = pages.get(currentAgent)) {
        if (page === undefined || page === null) return Promise.resolve();
        if (page.statusInFlight !== null) {
          page.statusAgain = true;
          return page.statusInFlight;
        }
        page.statusInFlight = (async () => {
          try {
            const reply = await call(`${NODE}.status`, agentArgs(page, {}));
            if (reply.ok) renderStatus(page, reply.value);
          } catch {
            // A status read is a convenience; a failure leaves the last one on screen.
          } finally {
            page.statusInFlight = null;
            if (page.statusAgain) {
              page.statusAgain = false;
              void refreshStatus(page);
            }
          }
        })();

      // The Python agent sends transient stream snapshots; the TypeScript agent continues sending
      // its existing change notifications. Either way this node is the source of truth, and a reload
      // fetches only the lines the page is missing.

      // so hidden pages stay live without starving /call. Batch list changes into one reconnect.
      function openFeed() {

        feedTimer = setTimeout(() => {
          feedTimer = null;
          const topics = [...new Set([...pages.values()].map((page) => page.topic))].sort();
          const url = topics.length === 0
            ? ''
            : '/events?node=' + encodeURIComponent(NODE) +
              topics.map((topic) => '&topic=' + encodeURIComponent(topic)).join('');
          if (url === familyFeedUrl) return;

          familyFeedUrl = url;
          familyFeed = url === '' ? null : window.NodeAgentEvents.connect(url);

          feed.onopen = () => {

            void refreshAgents();
            for (const page of pages.values()) {
              withPage(page, () => {
                // Reconnects preserve the reader's position. Only the visible page already at its
                // end keeps following; unseen pages land at their end when first opened.
                page.landAtBottom = page === pages.get(currentAgent) && atEnd(page);
                page.streamingMessage = null;
              });
              void load(page);
            }
          };
        }, 0);
      }
      // A posted line ends whatever snapshot was on screen: the transcript below is the truth, so the
      // tail is dropped and the window is read again.
      const reload = (page) => {
        withPage(page, () => {
          streamingMessage = null;
        });
        void load(page);
      };
      function onFeedEvent(page, event) {
        // Everything the event says about a turn is the page's own: `withPage` is what makes a
        // snapshot from a hidden agent land in that agent's transcript and nowhere else. The branches
        // that read the window again say so (`true`), because the reload is what draws them.
        let again = false;
        try {
          const value = JSON.parse(event.data).value;
          scheduleAgentsRefresh();
          // What the branch answers is whether the window has to be read again. A snapshot draws
          // itself and says no: a reload per token put a `history` read of the whole window between
          // the node and its own answer (and cleared the tail the reader was watching, while each
          // read cancelled the one before it - which is why a refreshed page drew no message at all
          // until the turn ended).
          again = withPage(page, () => {
            if (value?.type === 'stream') {
              // A snapshot is a turn in progress, and the tail it draws is what the reader watches.
              modelActive = true;
              streamingMessage = value.message;
              // The snapshot says a turn is running, and the node says which turn: a state of its own
              // is what the controls follow, so it is read again here (coalesced, so a snapshot per
              // token is still one read in flight).
              void refreshStatus(page);
              scheduleRender(page);
              return false; // a snapshot draws itself: the window is not read again
            }
            if (value?.type === 'ask') {
              // The node is waiting on a question: bring its card up and pull the reader to it.
              modelActive = true;
              liveAsks.add(value.message?.id);
              askScrollTo = value.message?.id ?? null;
              // A question the node put a deadline on counts down; one without just waits.
              const wait = askWait(value.message);
              if (wait) {
                askWaits.set(value.message.id, wait);
                askTimedOut.delete(value.message.id);
                startWaitTicker();
              }
              return true;
            }
            if (value?.type === 'ask_timeout') {
              // The node gave up on the question and carried on: the card stops counting, says what
              // the turn carried on with, and stops saying the reader is being waited on.
              const id = value.message?.id;
              if (id) {
                const wait = askWaits.get(id);
                if (wait) wait.default = value.message?.default ?? wait.default;
                askTimedOut.add(id);
                liveAsks.delete(id);
                tickWaits();
              }
              return true;
            }
            if (Array.isArray(value)) {
              const latest = value.at(-1);
              if (latest?.content === '(Stopped by user)' || latest?.content === 'aborted by user') {
                modelActive = false;
              } else if (
                latest?.role === 'user' ||
                latest?.role === 'tool' ||
                latest?.tool_calls?.length
              ) {
                modelActive = true;
              } else if (latest?.role === 'assistant') {
                modelActive = false;
                // The last line of a turn: the node may still be closing it for a moment, so read
                // the state once more after it, rather than polling for the whole turn.
                setTimeout(() => {
                  withPage(page, () => {
                    if (!busy()) void refreshStatus(page);
                  });
                }, 1000);
              }
            }
            // An event this page does not know is still news that something changed: the window is
            // read again, which is what draws it.
            return true;
          });
        } catch {}
        if (again) reload(page);
      }

      // MathJax starts itself a moment after its bundle runs — usually before any message has been asked
      // for, since that is a round trip away. A formula drawn in that moment was drawn as its TeX, and
      // this is the one paint that puts it right: `whenReady` calls back only if there was such a
      // formula, and only once, so a page with no renderer and a page whose renderer was ready all along
      // both do nothing here.
      window.agentMath.whenReady(() => {
        mathRedraw = true;
        renderTranscript();
      });

      // A change of language. The SDK's browser half redraws its own markers and announces the change
      // after it has drawn them, so what is left here is the sentences this script built: the tabs'
      // tooltips, the state word, the usage line, the transcript's cards and the chrome around them.
      // Every page is marked for a full paint — a hidden page repaints when it is next looked at, in
      // the language it will be read in — and the page on screen is repainted now, keeping the reader's
      // folds, drafts and place, because a repaint is what this page does on every snapshot anyway.
      if (typeof document.addEventListener === 'function') {
        document.addEventListener('node-agent:language', () => {
          for (const page of pages.values()) page.mathRedraw = true;
          const shown = pages.get(currentAgent);
          renderAgents();
          if (shown === undefined) return;
          paintChrome(shown);
          withPage(shown, () => renderTranscript());
        });
      }

      input.focus();
    </script>
  </body>
</html>
